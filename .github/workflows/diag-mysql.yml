name: Diag MySQL
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: check mysql env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "BEGIN"
            sudo grep -E '^(DB_|MYSQL)' /etc/wxx/env 2>&1 | sed 's/=.*/=***/' 
            echo "--- env 文件权限 ---"
            ls -la /etc/wxx/env
            echo "--- 尝试 mysql 连接测试 ---"
            sudo mysql -u root -e "SELECT 1" 2>&1 | head -3
            echo "END"
