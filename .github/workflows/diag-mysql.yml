name: Diag MySQL
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: check mysql env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "BEGIN"
            echo "DB_USER=$(sudo grep '^DB_USER=' /etc/wxx/env | cut -d= -f2-)"
            echo "DB_PWD_LEN=$(sudo grep '^DB_PASSWORD=' /etc/wxx/env | cut -d= -f2- | wc -c)"
            echo "DB_HOST=$(sudo grep '^DB_HOST=' /etc/wxx/env | cut -d= -f2-)"
            echo "--- mysql 用户认证方式 ---"
            sudo mysql -e "SELECT user,host,plugin FROM mysql.user WHERE user IN ('root','wxx') OR db='wxx';" 2>&1 | head -10
            echo "--- 用 env 凭据测试 TCP 连接 ---"
            U=$(sudo grep '^DB_USER=' /etc/wxx/env | cut -d= -f2-)
            P=$(sudo grep '^DB_PASSWORD=' /etc/wxx/env | cut -d= -f2-)
            H=$(sudo grep '^DB_HOST=' /etc/wxx/env | cut -d= -f2- | sed 's/.*@//')
            PORT=$(sudo grep '^DB_PORT=' /etc/wxx/env | cut -d= -f2-)
            sudo mysql -h "$H" -P "$PORT" -u "$U" -p"$P" -e "SELECT 1" 2>&1 | head -3
            echo "END"
