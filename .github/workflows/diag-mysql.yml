name: Diag MySQL
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: check mysql env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "BEGIN"
            echo "DB_DRIVER=[$(sudo grep '^DB_DRIVER=' /etc/wxx/env | cut -d= -f2-)]"
            echo "SQLITE_PATH=[$(sudo grep '^SQLITE_PATH=' /etc/wxx/env | cut -d= -f2-)]"
            echo "DB_PATH=[$(sudo grep '^DB_PATH=' /etc/wxx/env | cut -d= -f2-)]"
            echo "--- 当前 wxx-server 进程命令 ---"
            ps aux | grep wxx-server | grep -v grep
            echo "--- 尝试启动时实际用的 DB ---"
            sudo grep -c 'DB_' /etc/wxx/env
            echo "END"
