# 蔚小芯移动应用构建发布（iOS + HarmonyOS）
# 说明：手动触发。签名凭据（Apple / 华为 AGC）就绪后自动签名发布；
#       未配置凭据时产出未签名制品（Actions artifact）供测试。
# 版本号与 Web/Android 统一读 frontend/pubspec.yaml。
name: Build Mobile Apps

on:
  workflow_dispatch:
    inputs:
      ios_target:
        description: iOS 构建产物类型
        type: choice
        default: unsigned
        options:
          - unsigned   # 未签名 .app/.ipa 制品
          - signed     # 签名（需配置 Apple 凭据）
          - testflight # 签名并上传 TestFlight（需 App Store Connect API Key）
      harmonyos_target:
        description: 鸿蒙构建产物类型
        type: choice
        default: unsigned
        options:
          - unsigned # 未签名 .app 制品
          - signed   # 签名 .app（需配置华为 AGC 证书）

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Job 1：iOS 构建（macOS runner）
  # ═══════════════════════════════════════════════════════════════════
  build-ios:
    name: 构建 iOS (${{ inputs.ios_target }})
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep "^version:" frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "iOS version: $VERSION"

      # ── 签名凭据准备（signed/testflight 时才执行）──
      - name: 安装签名证书与描述文件
        if: inputs.ios_target != 'unsigned'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 证书与描述文件以 base64 存入 Secrets，运行时还原到钥匙串
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/dist_cert.p12
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist_cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          # 证书名（Apple Distribution: ...）
          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | grep "Apple Distribution" | awk -F'"' '{print $2}')
          if [ -z "$CERT_NAME" ]; then
            echo "未在钥匙串找到 Apple Distribution 证书，请检查 APPLE_CERT_BASE64"
            exit 1
          fi
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
          # 用真实值填充 ExportOptions.plist（仓库内为占位符）
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" frontend/ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :signingCertificate $CERT_NAME" frontend/ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.wxx.wxxApp $PROFILE_UUID" frontend/ios/ExportOptions.plist
          # 注入 DEVELOPMENT_TEAM + 手动签名到 pbxproj（Runner 与 RunnerTests 一并处理）
          python3 - <<'PYEOF'
          import os
          team_id = os.environ["APPLE_TEAM_ID"]
          p = "frontend/ios/Runner.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = %s;' % team_id)
          s = s.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";')
          open(p, "w", encoding="utf-8").write(s)
          print("pbxproj 签名配置注入完成")
          PYEOF
          echo "证书导入完成"

      - name: 构建 iOS 应用（注入地图 AK）
        env:
          BAIDU_AK: ${{ secrets.BAIDU_MAP_AK }}
          GAODE_AK: ${{ secrets.GAODE_MAP_AK }}
          TENXUN_AK: ${{ secrets.TENXUN_MAP_AK }}
        run: |
          B_AK="${BAIDU_AK:-OUouSU6WbYExGTlnDEFqqruhTH60KAwO}"
          G_AK="${GAODE_AK:-a2f48050b8ec16aca88db4d25c035fe6}"
          T_AK="${TENXUN_AK:-E5IBZ-ZSUC3-EQN3G-R2B5G-A7H4J-TQFIR}"
          if [ "${{ inputs.ios_target }}" = "unsigned" ]; then
            flutter build ios --release --no-codesign \
              --dart-define=BAIDU_MAP_AK="$B_AK" \
              --dart-define=GAODE_MAP_AK="$G_AK" \
              --dart-define=TENXUN_MAP_AK="$T_AK"
          else
            flutter build ipa --release \
              --dart-define=BAIDU_MAP_AK="$B_AK" \
              --dart-define=GAODE_MAP_AK="$G_AK" \
              --dart-define=TENXUN_MAP_AK="$T_AK" \
              --export-options-plist=ios/ExportOptions.plist
          fi
        working-directory: ./frontend

      - name: 整理制品
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          if [ "${{ inputs.ios_target }}" = "unsigned" ]; then
            # 未签名：打包 .app 为 zip（无证书签名，.ipa 无法真机安装）
            ditto -c -k --keepParent build/ios/iphoneos/Runner.app dist/weixiaoxin-ios-unsigned.app.zip
          else
            cp build/ios/ipa/*.ipa dist/weixiaoxin-ios-v${VERSION}.ipa 2>/dev/null || true
            # export 产物可能带 App 名，兜底查找
            ls build/ios/ipa/ | grep -i '\.ipa$' | head -1 | xargs -I{} cp "build/ios/ipa/{}" "dist/weixiaoxin-ios-v${VERSION}.ipa"
          fi
          ls -la dist/
        working-directory: ./frontend

      - name: 上传 iOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: wxx-ios-${{ steps.version.outputs.APP_VERSION }}
          path: frontend/dist/*
          retention-days: 30

      # ── 上传 TestFlight（凭据就绪时）──
      - name: 上传 TestFlight
        if: inputs.ios_target == 'testflight'
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: |
          # 安装 App Store Connect 上传工具
          npm i -g app-store-connect@2 >/dev/null 2>&1 || true
          if command -v app-store-connect >/dev/null 2>&1; then
            app-store-connect publish \
              --path "$(ls frontend/dist/weixiaoxin-ios-*.ipa | head -1)" \
              --api-key "$APPLE_ASC_KEY_ID" \
              --issuer-id "$APPLE_ASC_ISSUER_ID" \
              --private-key "$APPLE_ASC_PRIVATE_KEY"
          else
            # 兜底：用 xcrun altool
            echo "$APPLE_ASC_PRIVATE_KEY" > /tmp/AuthKey_$APPLE_ASC_KEY_ID.p8
            mkdir -p ~/.appstoreconnect/private_keys
            cp /tmp/AuthKey_$APPLE_ASC_KEY_ID.p8 ~/.appstoreconnect/private_keys/
            xcrun altool --upload-app \
              --file "$(ls frontend/dist/weixiaoxin-ios-*.ipa | head -1)" \
              --type ios \
              --apiKey "$APPLE_ASC_KEY_ID" \
              --apiIssuer "$APPLE_ASC_ISSUER_ID"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Job 2：HarmonyOS 构建（WebView 壳，hvigorw）
  # ═══════════════════════════════════════════════════════════════════
  build-harmonyos:
    name: 构建 HarmonyOS (${{ inputs.harmonyos_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17（HarmonyOS SDK 要求）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 国内 runner 需要走华为镜像源
      - name: 配置 npm 华为源
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm config set registry=https://repo.huaweicloud.com/repository/npm/

      # ── 安装 HarmonyOS 命令行工具（内含完整 SDK / hvigor / ohpm / node）──
      - name: 下载 HarmonyOS 命令行工具
        run: |
          # 华为云镜像（repo.huaweicloud.com）提供稳定的 linux-x64 命令行工具包，
          # 内含完整 SDK（sdk/）、hvigor、ohpm、node，无需再单独装 SDK。
          curl -L --fail --retry 3 -o /tmp/clt.zip \
            "https://repo.huaweicloud.com/harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip" \
            -H "User-Agent: Mozilla/5.0"
          mkdir -p /opt/clt
          unzip -q /tmp/clt.zip -d /opt/clt
          find /opt/clt -maxdepth 2 -type d | sort | head -20

      - name: 配置 HarmonyOS SDK 环境
        run: |
          CLT_DIR=$(find /opt/clt -maxdepth 2 -type d -name "command-line-tools" | head -1)
          if [ -z "$CLT_DIR" ]; then
            echo "未找到 command-line-tools 目录，列出解压内容："
            find /opt/clt -maxdepth 3 | head -40
            exit 1
          fi
          echo "CLT_DIR=$CLT_DIR" >> $GITHUB_ENV
          echo "DEVECO_SDK_HOME=$CLT_DIR/sdk" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=$CLT_DIR/sdk" >> $GITHUB_ENV
          echo "$CLT_DIR/tool/node/bin" >> $GITHUB_PATH
          echo "$CLT_DIR/bin" >> $GITHUB_PATH
          echo "SDK 结构："; ls "$CLT_DIR/sdk" 2>/dev/null | head

      - name: 配置签名文件（signed 目标，凭据就绪时）
        if: inputs.harmonyos_target == 'signed'
        env:
          HUAWEI_SIGNING_CERT: ${{ secrets.HUAWEI_SIGNING_CERT }}
          HUAWEI_SIGNING_P12: ${{ secrets.HUAWEI_SIGNING_P12 }}
          HUAWEI_SIGNING_PROFILE: ${{ secrets.HUAWEI_SIGNING_PROFILE }}
          HUAWEI_SIGNING_KEY_ALIAS: ${{ secrets.HUAWEI_SIGNING_KEY_ALIAS }}
          HUAWEI_SIGNING_KEY_PASSWORD: ${{ secrets.HUAWEI_SIGNING_KEY_PASSWORD }}
        run: |
          # 仅将签名材料解码到 signing/ 目录，供后续 hap-sign-tool 手动签名。
          # 不写入 build-profile.json5 —— hvigor 5.x 对 material 相对路径强制加 material/ 前缀，
          # 多次验证无法解析，故改用官方 hap-sign-tool.jar 直接对 unsigned HAP 签名。
          mkdir -p signing
          echo "$HUAWEI_SIGNING_CERT" | base64 --decode > signing/app-cert-chain.cer
          echo "$HUAWEI_SIGNING_P12" | base64 --decode > signing/app.p12
          echo "$HUAWEI_SIGNING_PROFILE" | base64 --decode > signing/app.p7b
          echo "签名材料就绪："
          ls -la signing/

      - name: 构建 APP（用命令行工具自带 hvigorw，产出 unsigned .app）
        run: |
          cd frontend/harmonyos
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Duser.country=CN"
          export HOS_SDK_HOME="${HOS_SDK_HOME:-${CLT_DIR}/sdk}"
          export DEVECO_SDK_HOME="${DEVECO_SDK_HOME:-${CLT_DIR}/sdk}"
          # 直接使用命令行工具自带的 hvigorw（位于 CLT_DIR/bin，已加 PATH），
          # 而非工程 ./hvigorw wrapper（其依赖 npm 下载 hvigor，dependencies 为空会静默失败）
          command -v hvigorw || exit 1
          hvigorw -v
          # 构建未签名 App Pack（.app，Release），签名用 hap-sign-tool 手动完成。
          # 注意：工程 build-profile.json5 的 signingConfigs 必须保持为空数组，
          # hvigor 5.x 对 material 路径强制加 material/ 前缀无法解析，签名在后续步骤手动完成。
          hvigorw assembleApp -p product=default -p buildMode=release --no-daemon
          APP=$(find build/outputs -name "*.app" | head -1)
          echo "产出 unsigned .app: $APP"
          echo "APP_FILE=$APP" >> $GITHUB_ENV

      - name: 手动签名 APP（signed 目标，用 hap-sign-tool.jar）
        if: inputs.harmonyos_target == 'signed'
        env:
          HUAWEI_SIGNING_KEY_ALIAS: ${{ secrets.HUAWEI_SIGNING_KEY_ALIAS }}
          HUAWEI_SIGNING_KEY_PASSWORD: ${{ secrets.HUAWEI_SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          HAP_TOOL=$(find ${CLT_DIR}/sdk -name "hap-sign-tool.jar" | head -1)
          if [ -z "$HAP_TOOL" ]; then
            echo "未找到 hap-sign-tool.jar，SDK 结构："
            find ${CLT_DIR}/sdk -maxdepth 4 | head -40
            exit 1
          fi
          echo "HAP_TOOL=$HAP_TOOL"
          # appCertFile 必须提供完整证书链（根CA→CA→叶子），hap-sign-tool 要求 cert chain
          echo "使用完整证书链签名"
          echo "unsigned .app: $APP_FILE"
          mkdir -p dist sign_work
          cd sign_work
          # 1. 解包 unsigned .app，找到内部 HAP
          python3 - <<'PYEOF'
          import zipfile, os, glob
          app = os.environ["APP_FILE"]
          z = zipfile.ZipFile(app)
          z.extractall(".")
          haps = [n for n in z.namelist() if n.endswith(".hap")]
          print("解包完成，HAP 列表:", haps)
          print("APP_FILES=" + " ".join(z.namelist()))  # 供重打包使用
          PYEOF
          # 2. 对内部每个 HAP 签名（覆盖写回同文件名，保持 .app 结构不变）
          find . -name "*.hap" | while read hap; do
            echo "签名 HAP: $hap"
            java -jar "$HAP_TOOL" sign-app \
              -mode localSign \
              -keyAlias "$HUAWEI_SIGNING_KEY_ALIAS" \
              -keyPwd "$HUAWEI_SIGNING_KEY_PASSWORD" \
              -appCertFile ../signing/app-cert-chain.cer \
              -profileFile ../signing/app.p7b \
              -profileSigned 1 \
              -inFile "$hap" \
              -signAlg SHA256withECDSA \
              -keystoreFile ../signing/app.p12 \
              -keystorePwd "$HUAWEI_SIGNING_KEY_PASSWORD" \
              -outFile "$hap" \
              -compatibleVersion 12 \
              -signCode 1
          done
          # 3. 重打包为签名 .app（内部 HAP 已签名）
          cd ..
          python3 - <<'PYEOF'
          import zipfile, os
          out = "dist/weixiaoxin-signed.app"
          z = zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk("sign_work"):
            for f in files:
              p = os.path.join(root, f)
              rel = os.path.relpath(p, "sign_work")
              z.write(p, rel)
          z.close()
          print("内部 HAP 已签名并重打包:", out)
          PYEOF
          # 4. 对 .app 外壳签名（上架需 App Pack 外壳签名）
          java -jar "$HAP_TOOL" sign-app \
            -mode localSign \
            -keyAlias "$HUAWEI_SIGNING_KEY_ALIAS" \
            -keyPwd "$HUAWEI_SIGNING_KEY_PASSWORD" \
            -appCertFile signing/app-cert-chain.cer \
            -profileFile signing/app.p7b \
            -profileSigned 1 \
            -inFile dist/weixiaoxin-signed.app \
            -signAlg SHA256withECDSA \
            -keystoreFile signing/app.p12 \
            -keystorePwd "$HUAWEI_SIGNING_KEY_PASSWORD" \
            -outFile dist/weixiaoxin-full.app \
            -compatibleVersion 12 \
            -signCode 1
          echo "签名完成："
          ls -la dist/

      - name: 整理 APP 制品
        run: |
          mkdir -p dist
          if [ "${{ inputs.harmonyos_target }}" = "signed" ]; then
            # signed 目标已产出 weixiaoxin-full.app（外壳+内部HAP均签名）
            ls -la dist/
          else
            cp "$APP_FILE" dist/$(basename "$APP_FILE")
            ls -la dist/
          fi

      - name: 上传 APP 制品
        uses: actions/upload-artifact@v4
        with:
          name: wxx-harmonyos-${{ github.run_id }}
          path: dist/*
          retention-days: 30
