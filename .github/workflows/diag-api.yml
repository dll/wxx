name: Diag API
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 简单查询
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 登录 ---"
            RESP=$(curl -sk -m 5 -X POST https://localhost/api/v1/auth/login -H "Host: www.wxx-agent.online" -H "Content-Type: application/json" -d '{"username":"student1","password":"wxx123456"}')
            echo "$RESP" | head -c 200
            TOKEN=$(echo "$RESP" | grep -o '"token":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo ""
            echo "token=${TOKEN:0:30}..."
            echo "--- 查询 process ---"
            curl -sk -m 5 -H "Authorization: Bearer $TOKEN" -H "Host: www.wxx-agent.online" https://localhost/api/v1/process/definitions/process-registration-2026 | head -c 500
            echo ""
            echo "DIAG_END"
