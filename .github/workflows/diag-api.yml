name: Diag API
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 检查服务器 wxx-server 版本
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- wxx-server 版本 ---"
            /opt/wxx/wxx-server -version 2>&1 || ls -la /opt/wxx/wxx-server 2>&1
            echo "--- 运行时间 ---"
            ps -p $(pgrep -f wxx-server) -o lstart,etime 2>&1 || echo "进程未找到"
            echo "DIAG_END"
