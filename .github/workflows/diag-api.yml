name: Diag API
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 直接测 process API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 登录获取token ---"
            RESP=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{"username":"student1","password":"wxx123456"}')
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['token'])")
            echo "token ok: ${#TOKEN} chars"
            echo "--- 查 process-registration-2026 ---"
            curl -s "localhost:8080/api/v1/process/definitions/process-registration-2026" -H "Authorization: Bearer $TOKEN" -w "\nHTTP %{http_code}" | tail -3
            echo ""
            echo "--- 查所有 definitions ---"
            curl -s "localhost:8080/api/v1/process/definitions" -H "Authorization: Bearer $TOKEN" -w "\nHTTP %{http_code}" | head -c 500
            echo ""
            echo "DIAG_END"
