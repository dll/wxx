name: Diag API
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH student1 测 process
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            RESP=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{"username":"student1","password":"wxx123456"}')
            echo "login: $(echo $RESP | head -c 80)"
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
            echo "token: ${#TOKEN}"
            if [ -n "$TOKEN" ] && [ ${#TOKEN} -gt 10 ]; then
              echo "--- process-registration-2026 ---"
              curl -s "localhost:8080/api/v1/process/definitions/process-registration-2026" -H "Authorization: Bearer $TOKEN" | head -c 500
              echo ""
              echo "--- list definitions ---"
              curl -s "localhost:8080/api/v1/process/definitions" -H "Authorization: Bearer $TOKEN" | head -c 300
            fi
            echo "DIAG_END"
