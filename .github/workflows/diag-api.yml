name: Diag API
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 查询 process-registration-2026
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 查询 process-registration-2026 ---"
            curl -s -m 5 localhost:8080/api/v1/process/definitions/process-registration-2026 -H "X-User-ID: 1" -H "X-User-Role: student" | head -c 500
            echo ""
            echo "DIAG_END"
