# 蔚小芯 后端自动部署到 Vercel
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'api/**'
      - 'vercel.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到 Vercel
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Vercel CLI
        run: npm install -g vercel@latest

      - name: 配置 Vercel 凭证（支持自动刷新 token）
        run: |
          mkdir -p ~/.vercel
          cat > ~/.vercel/auth.json << 'EOF'
          {
            "token": "${{ secrets.VERCEL_TOKEN }}",
            "userId": "${{ secrets.VERCEL_USER_ID }}",
            "refreshToken": "${{ secrets.VERCEL_REFRESH_TOKEN }}",
            "expiresAt": 1
          }
          EOF
          echo "=== 初始凭证 ==="
          cat ~/.vercel/auth.json | sed 's/"token": "[^"]*"/"token": "***"/g' | sed 's/"refreshToken": "[^"]*"/"refreshToken": "***"/g'

      - name: 测试 Vercel CLI 登录状态
        run: |
          echo "=== 测试 vercel whoami ==="
          vercel whoami 2>&1 || true
          echo "=== 刷新后的凭证 ==="
          cat ~/.vercel/auth.json | sed 's/"token": "[^"]*"/"token": "***"/g' | sed 's/"refreshToken": "[^"]*"/"refreshToken": "***"/g' || true

      - name: 配置 Vercel 项目
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json
          cat .vercel/project.json

      - name: 部署到 Vercel（生产环境）
        run: |
          echo "=== 开始部署 ==="
          vercel deploy --prod --yes 2>&1
          echo "=== 部署完成 ==="
