name: Diag Twin
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 查密码与登录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 数据库种子账号 ---"
            sudo sqlite3 /opt/wxx/data/wxx.db "SELECT username, role, status, substr(password_hash,1,10) FROM users WHERE username IN ('collegeadmin','admin','schooladmin','counselor_cs')" 2>&1 || echo "sqlite3 不可用"
            echo "--- 试 admin123 ---"
            for u in collegeadmin admin schooladmin; do
              R=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d "{\"username\":\"$u\",\"password\":\"admin123\"}")
              echo "$u/admin123: $(echo $R | head -c 80)"
            done
            echo "--- 试 wxx123456 ---"
            for u in collegeadmin admin; do
              R=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d "{\"username\":\"$u\",\"password\":\"wxx123456\"}")
              echo "$u/wxx123456: $(echo $R | head -c 80)"
            done
            echo "DIAG_END"
