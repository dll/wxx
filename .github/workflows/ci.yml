# 蔚小芯 CI 工作流
# 触发：push 和 PR 到 main 分支时运行

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-backend:
    name: Go 后端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 下载依赖
        run: go mod download

      - name: 静态检查（go vet）
        run: go vet -tags fts5 ./...

      - name: 格式检查（gofmt）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 编译检查
        run: go build -tags fts5 ./...

      - name: 单元测试
        run: go test -v -race -cover -tags fts5 -timeout=30m ./...

  flutter-frontend:
    name: Flutter 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 单元测试
        run: flutter test

      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  lint-docs:
    name: 文档与配置检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 .env 文件未被提交
        run: |
          if [ -f .env ]; then
            echo "错误：.env 文件不应被提交到仓库"
            exit 1
          fi

      - name: 检查必要文件存在
        run: |
          for f in CLAUDE.md AGENTS.md README.md Makefile .env.example .gitignore; do
            if [ ! -f "$f" ]; then
              echo "错误：缺少必要文件 $f"
              exit 1
            fi
          done
