name: Diag Verify
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 验证登录与 twin-screen
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            RESP=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{"username":"collegeadmin","password":"wxx123456"}')
            echo "collegeadmin login: $(echo $RESP | head -c 120)"
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
            echo "token: ${#TOKEN} chars"
            echo "--- twin-screen ---"
            curl -s "localhost:8080/api/v1/college/twin-screen" -H "Authorization: Bearer $TOKEN" | head -c 300
            echo ""
            echo "DIAG_END"
