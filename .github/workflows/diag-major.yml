name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 查看后端日志
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 后端最近日志 ---"
            sudo journalctl -u wxx --no-pager -n 30 2>&1 | grep -iE "error|fail|问答|chat|检索|panic|severe" | tail -15
            echo "--- 健康 ---"
            curl -s localhost:8080/health | head -c 150
            echo ""
            echo "DIAG_END"
