name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 验证学科专业问答
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            RESP=$(curl -s localhost:8080/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{"username":"student1","password":"wxx123456"}')
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('data',{}).get('token',''))" 2>/dev/null)
            echo "token: ${#TOKEN}"
            echo "--- 学科专业问答 ---"
            curl -s -X POST "localhost:8080/api/v1/chat" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"message":"计算机科学与技术专业的培养方案是什么"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('code:',d.get('code'));print('content:',str(d.get('data',{}).get('answer',d.get('data',{}).get('content','')))[:200])" 2>/dev/null
            echo ""
            echo "--- 学科专业资源入库检查 ---"
            curl -s "localhost:8080/api/v1/process/definitions" -H "Authorization: Bearer $TOKEN" | head -c 100
            echo ""
            echo "DIAG_END"
