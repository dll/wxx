name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 重启并用当前二进制
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 当前二进制含058? ---"
            strings /opt/wxx/wxx-server | grep -c "058_major_knowledge"
            echo "--- 重启 ---"
            sudo systemctl restart wxx
            sleep 4
            systemctl is-active wxx
            echo "--- 迁移 ---"
            python3 -c "import sqlite3;c=sqlite3.connect('/opt/wxx/data/wxx.db');print([r[0] for r in c.execute('SELECT filename FROM _migrations ORDER BY id DESC LIMIT 4')])" 2>&1
            echo "--- 学科资源 ---"
            python3 -c "import sqlite3;c=sqlite3.connect('/opt/wxx/data/wxx.db');print(c.execute('SELECT count(*) FROM kb_resources WHERE resource_id LIKE \"major-%\"').fetchone())" 2>&1
            echo "DIAG_END"
