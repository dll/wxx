name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 检查 systemd 服务配置
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- wxx.service ExecStart ---"
            systemctl cat wxx 2>/dev/null | grep -iE "ExecStart|WorkingDirectory|Environment"
            echo "--- 运行进程 ---"
            ps aux | grep wxx-server | grep -v grep | head -3
            echo "--- 运行进程路径 ---"
            readlink -f /proc/$(pgrep -f wxx-server | head -1)/exe 2>/dev/null || echo "无法获取"
            echo "DIAG_END"
