name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 检查迁移与二进制
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- wxx-server 二进制时间 ---"
            ls -la /opt/wxx/wxx-server
            echo "--- 数据库迁移表 ---"
            sudo sqlite3 /opt/wxx/data/wxx.db "SELECT filename FROM schema_migrations ORDER BY id DESC LIMIT 5" 2>&1 || echo "sqlite3 不可用"
            echo "--- 学科专业资源 ---"
            sudo sqlite3 /opt/wxx/data/wxx.db "SELECT resource_id, title FROM kb_resources WHERE resource_id LIKE 'major-%'" 2>&1 || echo "sqlite3 不可用"
            echo "DIAG_END"
