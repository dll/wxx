name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 用 python 查库
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 数据库迁移表 ---"
            python3 -c "import sqlite3;c=sqlite3.connect('/opt/wxx/data/wxx.db');print(c.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%migration%'\").fetchall());print(c.execute(\"SELECT * FROM schema_migrations ORDER BY version DESC LIMIT 8\").fetchall() if c.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name='schema_migrations'\").fetchone() else 'no schema_migrations')" 2>&1 | head -10
            echo "--- 学科专业资源 ---"
            python3 -c "import sqlite3;c=sqlite3.connect('/opt/wxx/data/wxx.db');print(c.execute(\"SELECT resource_id,title FROM kb_resources WHERE resource_id LIKE 'major-%'\").fetchall())" 2>&1 | head -5
            echo "DIAG_END"
