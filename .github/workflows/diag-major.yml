name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 查 _migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            python3 -c "import sqlite3;c=sqlite3.connect('/opt/wxx/data/wxx.db');rows=c.execute('SELECT * FROM _migrations ORDER BY 1 DESC LIMIT 12').fetchall();[print(r) for r in rows]" 2>&1 | head -15
            echo "DIAG_END"
