name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 验证学科专业知识入库
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 查学科专业知识入库 ---"
            curl -s "localhost:8080/api/v1/knowledge/public?keyword=%E8%AE%A1%E7%AE%97%E6%9C%BA&resource_type=FAQ" | head -c 500
            echo ""
            echo "DIAG_END"
