name: Diag Major
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH 检查二进制含058
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 二进制是否含 058 ---"
            strings /opt/wxx/wxx-server 2>/dev/null | grep -c "058_major_knowledge" || echo "0"
            echo "--- 进程启动时间 ---"
            ps -o lstart,cmd -p $(pgrep -f wxx-server | head -1) 2>/dev/null
            echo "DIAG_END"
