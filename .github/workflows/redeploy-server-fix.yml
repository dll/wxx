# 一次性修复工作流：P0-06/P0-04 后端部署（scp 挂起导致重启未执行）
# 检查服务器二进制时间戳；若已更新则重启，若未更新则 git pull + 重新编译。
name: Redeploy Server Fix

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH 检查并部署后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== 部署开始 $(date) ==="
            echo "--- 当前二进制信息 ---"
            ls -la /opt/wxx/wxx-server
            echo "--- 当前运行进程 ---"
            ps -o pid,lstart,cmd -p $(pgrep -f '/opt/wxx/wxx-server' | head -1) || true

            # 检查 /opt/wxx 是否为 git 仓库
            if [ -d /opt/wxx/.git ]; then
              echo "--- git 仓库存在，拉取最新代码 ---"
              cd /opt/wxx
              git fetch origin main 2>&1 | tail -2 || true
              git reset --hard origin/main 2>&1 | tail -2
              echo "--- 重新编译 wxx-server ---"
              export GOPROXY=https://goproxy.cn,direct
              cd /opt/wxx/server
              go build -tags fts5 -o /opt/wxx/wxx-server ./cmd/server
              echo "编译完成"
            else
              echo "--- /opt/wxx 非 git 仓库，检查 scp 是否已上传新二进制 ---"
            fi

            echo "--- 重启服务 ---"
            chmod +x /opt/wxx/wxx-server
            sudo systemctl stop wxx 2>/dev/null || true
            sleep 1
            sudo systemctl start wxx
            sleep 3
            systemctl is-active wxx
            echo "--- health 检查 ---"
            curl -s -m 5 localhost:8080/health && echo "" || echo "health check failed"
            echo "--- 新进程启动时间 ---"
            ps -o pid,lstart,cmd -p $(pgrep -f '/opt/wxx/wxx-server' | head -1)
            echo "=== 部署完成 ==="
