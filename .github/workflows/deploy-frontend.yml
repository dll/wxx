name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: 构建并部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本
        run: flutter build web --release --web-renderer canvaskit
        working-directory: ./frontend

      - name: 创建 functions 目录
        run: mkdir -p frontend/build/web/functions

      - name: 复制 Functions 文件到构建目录
        run: cp -r functions/* frontend/build/web/functions/

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build/web --project-name=wxx-agent