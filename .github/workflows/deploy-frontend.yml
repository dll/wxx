name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  # ── Job 1：构建 Web 并部署到 Cloudflare Pages ────────────────────────────
  deploy-web:
    name: 构建并部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本（注入百度地图 AK）
        run: >-
          flutter build web --release
          --web-renderer canvaskit
          --dart-define=BAIDU_MAP_AK=${{ secrets.BAIDU_MAP_AK }}
        working-directory: ./frontend

      # bcryptjs 是 Functions 运行时依赖（与 Go 后端 bcrypt 哈希兼容）。
      # 安装到 functions/ 目录，由 wrangler --functions-dir 在部署时独立打包；
      # 不再复制 node_modules 到静态目录，避免文件超 CF Pages 25 MiB 限制。
      - name: 安装 Functions 依赖
        run: npm install --omit=dev
        working-directory: ./functions

      # _routes.json 会将 /api/* 排除在 Pages Functions 之外，
      # 导致 API 请求返回 405，部署前必须移除
      - name: 移除 _routes.json（避免覆盖 Pages Functions 路由）
        run: rm -f frontend/build/web/_routes.json

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --functions-dir=functions：wrangler 独立打包 functions/（含 node_modules），
          # 静态文件目录 frontend/build/web 不含 node_modules，不触发 25 MiB 限制
          command: pages deploy frontend/build/web --project-name=wxx-agent --functions-dir=functions

  # ── Job 2：构建 Android APK 并上传制品 ────────────────────────────────────
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17（Android 构建依赖）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 APK（注入百度地图 AK）
        run: >-
          flutter build apk --release
          --dart-define=BAIDU_MAP_AK=${{ secrets.BAIDU_MAP_AK }}
        working-directory: ./frontend

      - name: 读取版本号并重命名 APK
        run: |
          VERSION=$(grep "^version:" frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "dist/weixiaoxin-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 上传 APK 制品（Actions 页面可下载，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: weixiaoxin-v${{ env.APK_VERSION }}-apk
          path: dist/*.apk
          retention-days: 30
