# 蔚小芯前端自动部署到腾讯云 Lighthouse
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  # ── Job 1：构建 Web 并部署到腾讯云 Lighthouse ─────────────────────────
  deploy-web:
    name: 构建并部署到腾讯云 Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本（注入百度地图 AK）
        run: |
          flutter build web --release \
            --web-renderer canvaskit \
            --dart-define=BAIDU_MAP_AK=${{ secrets.BAIDU_MAP_AK }}
        working-directory: ./frontend

      - name: 上传到腾讯云服务器
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "frontend/build/web/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/opt/wxx/frontend/web"
          EXCLUDE: "/downloads/"

  # ── Job 2：构建 Android APK 并上传制品 ───────────────────────────────
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17（Android 构建依赖）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 APK（注入百度地图 AK）
        run: |
          flutter build apk --release \
            --dart-define=BAIDU_MAP_AK=${{ secrets.BAIDU_MAP_AK }}
        working-directory: ./frontend

      - name: 读取版本号并重命名 APK
        run: |
          VERSION=$(grep "^version:" frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "dist/wxx-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 上传 APK 制品（Actions 页面可下载，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: wxx-v${{ env.APK_VERSION }}-apk
          path: dist/*.apk
          retention-days: 30
