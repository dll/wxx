# 蔚小芯前端自动部署到腾讯云 Lighthouse
# v0.0.17+：含后端 wxx-server 编译上传 + 服务重启 + 质量门禁
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: read

jobs:
  # ── Job 0：质量门禁 — 部署前置检查 ─────────────────────────────────────
  # 修复 GPT56SOL v3 §N3-03：此前 deploy-web/deploy-server/build-apk 均无 needs，
  # 即使 ci.yml 全红生产仍会照常部署。现所有部署 job 均 needs: [quality-gate]。
  quality-gate:
    name: 质量门禁（gofmt / go vet / go build / flutter analyze）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 下载依赖
        run: go mod download
        working-directory: ./server

      - name: 格式检查（gofmt）
        run: |
          unformatted=$(gofmt -l server/ || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，部署阻断："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查（go vet）
        run: go vet -tags fts5 ./...
        working-directory: ./server

      - name: 编译检查
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags fts5 ./...
        working-directory: ./server

      - name: 单元测试（快包，防回归）
        run: go test -tags fts5 -count=1 -timeout=300s ./internal/auth ./internal/config ./internal/middleware
        working-directory: ./server

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 静态分析（flutter analyze）
        # 仅 error/warning 阻断；info 级（216 条）为已知可接受
        run: flutter analyze --no-pub --no-fatal-infos
        working-directory: ./frontend

      - name: 前端测试
        run: flutter test --no-pub
        working-directory: ./frontend

      - name: Web Release 构建检查
        run: flutter build web --release --dart-define=BAIDU_MAP_AK=ci-check --dart-define=GAODE_MAP_AK=ci-check --dart-define=TENXUN_MAP_AK=ci-check
        working-directory: ./frontend

  # ── Job 1：构建 Web 并部署到腾讯云 Lighthouse ─────────────────────────
  deploy-web:
    name: 构建并部署到腾讯云 Lighthouse
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本（注入百度/高德/腾讯地图 AK）
        env:
          BAIDU_AK: ${{ secrets.BAIDU_MAP_AK }}
          GAODE_AK: ${{ secrets.GAODE_MAP_AK }}
          TENXUN_AK: ${{ secrets.TENXUN_MAP_AK }}
        run: |
          # AK 优先取 GitHub Secrets，未配置则使用 build-all.ps1 中的公开值
          set -euo pipefail
          test -n "$BAIDU_AK" || { echo '缺少 BAIDU_MAP_AK secret'; exit 1; }
          test -n "$GAODE_AK" || { echo '缺少 GAODE_MAP_AK secret'; exit 1; }
          test -n "$TENXUN_AK" || { echo '缺少 TENXUN_MAP_AK secret'; exit 1; }
          B_AK="$BAIDU_AK"
          G_AK="$GAODE_AK"
          T_AK="$TENXUN_AK"
          flutter build web --release \
            --web-renderer canvaskit \
            --dart-define=BAIDU_MAP_AK="$B_AK" \
            --dart-define=GAODE_MAP_AK="$G_AK" \
            --dart-define=TENXUN_MAP_AK="$T_AK"
        working-directory: ./frontend

      - name: 后处理：本地化 CanvasKit + 禁用 Service Worker
        # flutter_bootstrap.js 默认从 gstatic.com 加载 CanvasKit（国内被屏蔽
        # 导致白屏）且注册 Service Worker（HTTP 非 secure context 不可用）。
        # 替换为本地 /canvaskit/ 路径并去掉 SW 注册，与 build-all.ps1 逻辑一致。
        run: |
          python3 -c "
          import re
          p = 'frontend/build/web/flutter_bootstrap.js'
          t = open(p, encoding='utf-8').read()
          pattern = r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{\s*serviceWorkerVersion:\s*\"[^\"]*\"\s*\}\s*\}\);'
          replacement = '_flutter.loader.load({ config: { canvasKitBaseUrl: \"/canvaskit/\" } });'
          t2 = re.sub(pattern, replacement, t)
          if t2 == t:
              print('WARN: 未匹配到 serviceWorkerSettings，检查 Flutter 版本')
          else:
              print('OK: 已替换为本地 CanvasKit + 禁用 SW')
          open(p, 'w', encoding='utf-8').write(t2)
          "
          # 验证 CanvasKit 本地文件存在
          ls -la frontend/build/web/canvaskit/canvaskit.js frontend/build/web/canvaskit/canvaskit.wasm
          # 验证替换结果
          echo "canvasKitBaseUrl 出现次数: $(grep -c canvasKitBaseUrl frontend/build/web/flutter_bootstrap.js)"
          echo "serviceWorkerSettings 出现次数: $(grep -c serviceWorkerSettings frontend/build/web/flutter_bootstrap.js || true)"

      - name: 上传到腾讯云服务器
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "frontend/build/web/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/opt/wxx/frontend/web"
          EXCLUDE: "/downloads/"

  # ── Job 2：构建 Go 后端并部署到腾讯云 Lighthouse ───────────────────────
  deploy-server:
    name: 构建并部署后端到腾讯云
    runs-on: ubuntu-latest
    needs: [quality-gate]
    # Go FTS5 交叉编译约 19 分钟；原 20 分钟上限会在 rsync 上传刚开始时硬取消。
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 下载依赖
        run: go mod download
        working-directory: ./server

      # 在 CI runner 上编译二进制（runner 访问 GitHub 稳定），scp 到服务器替换重启。
      # 彻底绕开「服务器→GitHub fetch 源码」的不稳定链路（git/codeload 在国内常超时/截断），
      # 根治 deploy-server 反复因 fetch/tarball 失败而 job 失败的问题（见 commit 9cf3633 前的教训）。
      # systemd ExecStart=/opt/wxx/wxx-server；迁移在服务启动时由 app.NewWithConfig 自动执行。
      - name: 编译后端二进制(FTS5)
        run: |
          mkdir -p dist
          go build -tags fts5 -o ./dist/wxx-server.new ./cmd/server
          test -x ./dist/wxx-server.new && echo "编译产物: $(ls -la ./dist/wxx-server.new)" || (echo "[ERROR] 编译失败"; exit 1)
        working-directory: ./server

      - name: 上传二进制到服务器(rsync,与前端同款可靠)
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "server/dist/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/tmp/wxx-dist"
          EXCLUDE: ""
      - name: 服务器替换重启后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 240s
          script: |
            set -e
            echo "=== 后端替换重启 $(date +%H:%M:%S) ==="
            # 0. 校验上传的二进制
            test -x /tmp/wxx-dist/wxx-server.new || { echo "[ERROR] 上传的二进制缺失"; exit 1; }
            echo "上传产物: $(ls -la /tmp/wxx-dist/wxx-server.new)"
            # 1. 备份数据库（部署前）——MySQL，密码从 /etc/wxx/env 提取
            echo "--- 备份 MySQL ---"
            DB_PW=$(grep '^DB_PASSWORD=' /etc/wxx/env | cut -d= -f2-)
            DB_NAME=$(grep '^DB_NAME=' /etc/wxx/env | cut -d= -f2-)
            mysqldump -h127.0.0.1 -uwxx -p"$DB_PW" "$DB_NAME" > "/opt/wxx/backup/wxx-pre-$(date +%Y%m%d%H%M).sql" 2>/dev/null && \
              echo "备份完成: $(ls -la /opt/wxx/backup/wxx-pre-$(date +%Y%m%d%H%M).sql)" || echo "[warn] MySQL 备份失败(忽略,继续)"
            # 2. 保留回滚二进制(最近备份)
            sudo cp -f /opt/wxx/wxx-server /opt/wxx/wxx-server.rollback.$(date +%Y%m%d%H%M) 2>/dev/null || true
            sudo chmod +x /tmp/wxx-dist/wxx-server.new
            # 3. 替换 + 重启（严格模式：服务未激活/迁移未生效/健康检查失败 → 阻断部署）
            echo "--- stop wxx ---"
            sudo systemctl stop wxx
            sleep 2
            sudo cp /tmp/wxx-dist/wxx-server.new /opt/wxx/wxx-server
            echo "--- start wxx ---"
            sudo systemctl start wxx
            sleep 6
            # 3a. 服务必须激活，否则回滚旧二进制并阻断
            if ! systemctl is-active --quiet wxx; then
              echo "[ERROR] wxx 启动失败，回滚到上一版二进制"
              ROLLBACK=$(ls -t /opt/wxx/wxx-server.rollback.* 2>/dev/null | head -1)
              if [ -n "$ROLLBACK" ]; then
                sudo cp "$ROLLBACK" /opt/wxx/wxx-server
                sudo systemctl start wxx || true
                echo "[ERROR] 已回滚到 $ROLLBACK"
              fi
              echo "--- 最近 50 行服务日志（排查迁移/启动失败根因）---"
              sudo journalctl -u wxx -n 50 --no-pager || true
              exit 1
            fi
            echo "[OK] wxx active"
            # 3b. 显式验证迁移已生效：campus_checkin_steps 必须恢复 12 条 published 节点
            DB_PW2=$(grep '^DB_PASSWORD=' /etc/wxx/env | cut -d= -f2-)
            DB_NAME2=$(grep '^DB_NAME=' /etc/wxx/env | cut -d= -f2-)
            PUB_COUNT=$(mysql -h127.0.0.1 -uwxx -p"$DB_PW2" "$DB_NAME2" -N -e "SELECT COUNT(*) FROM campus_checkin_steps WHERE status='published'" 2>/dev/null || echo "ERR")
            echo "campus_checkin_steps published 数量 = $PUB_COUNT"
            if [ "$PUB_COUNT" = "ERR" ] || [ "$PUB_COUNT" = "0" ]; then
              echo "[ERROR] 迁移未生效：campus_checkin_steps 无 published 节点。请检查 _migrations 表与 110_restore_campus_steps.sql"
              echo "--- 迁移记录表 tail ---"
              mysql -h127.0.0.1 -uwxx -p"$DB_PW2" "$DB_NAME2" -e "SELECT id,filename,executed_at FROM _migrations ORDER BY id DESC LIMIT 5" 2>/dev/null || true
              echo "--- 最近 50 行服务日志 ---"
              sudo journalctl -u wxx -n 50 --no-pager || true
              exit 1
            fi
            echo "[OK] 迁移验证通过：已恢复 $PUB_COUNT 条 published 报到节点"
            # 3c. 健康检查显式阻断
            echo "--- 健康检查 ---"
            if ! curl -s -m 8 localhost:8080/health; then
              echo ""
              echo "[ERROR] 健康检查失败，阻断部署"
              exit 1
            fi
            echo ""
            echo "[OK] 后端部署 + 迁移 + 健康检查全部通过"
            rm -rf /tmp/wxx-dist



  # ── Job 3：构建 Android APK 并上传制品 ───────────────────────────────
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: [quality-gate]
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17（Android 构建依赖）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 APK（注入百度/高德/腾讯地图 AK）
        env:
          BAIDU_AK: ${{ secrets.BAIDU_MAP_AK }}
          GAODE_AK: ${{ secrets.GAODE_MAP_AK }}
          TENXUN_AK: ${{ secrets.TENXUN_MAP_AK }}
        run: |
          set -euo pipefail
          test -n "$BAIDU_AK" || { echo '缺少 BAIDU_MAP_AK secret'; exit 1; }
          test -n "$GAODE_AK" || { echo '缺少 GAODE_MAP_AK secret'; exit 1; }
          test -n "$TENXUN_AK" || { echo '缺少 TENXUN_MAP_AK secret'; exit 1; }
          B_AK="$BAIDU_AK"
          G_AK="$GAODE_AK"
          T_AK="$TENXUN_AK"
          flutter build apk --release \
            --dart-define=BAIDU_MAP_AK="$B_AK" \
            --dart-define=GAODE_MAP_AK="$G_AK" \
            --dart-define=TENXUN_MAP_AK="$T_AK"
        working-directory: ./frontend

      - name: 读取版本号并重命名 APK
        run: |
          VERSION=$(grep "^version:" frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          # 固定名 weixiaoxin.apk：配合 releases/latest/download 固定下载入口，
          # 前端 release_config.dart 无需随版本改地址
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/weixiaoxin.apk
          # 版本化副本：GitHub 资产名强制 ASCII（实测中文名会被改成 default.apk），
          # 中文产品名「蔚小芯」展示在 Release 标题/说明与应用内下载名。
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "dist/weixiaoxin-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 上传 APK 制品（Actions 页面可下载，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: wxx-v${{ env.APK_VERSION }}-apk
          path: dist/*.apk
          retention-days: 30

      # APK 走 GitHub Release 分发，不再打进 Web 静态包（超 Pages 25MB 单文件限制）
      - name: 发布 GitHub Release（APK 分发入口）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APK_VERSION }}
          name: 蔚小芯 v${{ env.APK_VERSION }}
          body: |
            蔚小芯 Android 客户端 v${{ env.APK_VERSION }}

            下载：[蔚小芯 v${{ env.APK_VERSION }}](https://github.com/${{ github.repository }}/releases/download/v${{ env.APK_VERSION }}/weixiaoxin-v${{ env.APK_VERSION }}.apk)

            固定入口（始终指向最新版，应用内二维码使用）：
            https://github.com/${{ github.repository }}/releases/latest/download/weixiaoxin.apk

            Web 端：https://wxx-agent.online
          files: |
            dist/weixiaoxin.apk
            dist/weixiaoxin-v${{ env.APK_VERSION }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
