name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'functions/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: 构建并部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本
        run: flutter build web --release --web-renderer canvaskit
        working-directory: ./frontend

      # bcryptjs 是 Functions 的运行时依赖（与 Go 后端 bcrypt 哈希兼容）。
      # 必须先安装：否则边缘打包时模块解析失败，登录接口直接 500。
      - name: 安装 Functions 依赖
        run: npm install --omit=dev
        working-directory: ./functions

      - name: 创建 functions 目录
        run: mkdir -p frontend/build/web/functions

      - name: 复制 Functions 文件到构建目录（含 node_modules）
        run: cp -r functions/* frontend/build/web/functions/

# ── 构建产物中可能包含 _routes.json（由 Flutter Web 构建生成）
# 其 exclude 列表会将 /api/* 路由排除在 Pages Functions 之外，
# 导致 API 请求返回 405。这里在部署前移除该文件以确保函数正常路由。  
      - name: 移除 _routes.json（避免覆盖 Pages Functions 路由）
        run: rm -f frontend/build/web/_routes.json

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build/web --project-name=wxx-agent