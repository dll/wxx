# 蔚小芯前端自动部署到腾讯云 Lighthouse
# v0.0.17+：含后端 wxx-server 编译上传 + 服务重启 + 质量门禁
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  # ── Job 0：质量门禁 — 部署前置检查 ─────────────────────────────────────
  # 修复 GPT56SOL v3 §N3-03：此前 deploy-web/deploy-server/build-apk 均无 needs，
  # 即使 ci.yml 全红生产仍会照常部署。现所有部署 job 均 needs: [quality-gate]。
  quality-gate:
    name: 质量门禁（gofmt / go vet / go build / flutter analyze）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 下载依赖
        run: go mod download
        working-directory: ./server

      - name: 格式检查（gofmt）
        run: |
          unformatted=$(gofmt -l server/ || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，部署阻断："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查（go vet）
        run: go vet -tags fts5 ./...
        working-directory: ./server

      - name: 编译检查
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags fts5 ./...
        working-directory: ./server

      - name: 单元测试（快包，防回归）
        run: go test -tags fts5 -count=1 -timeout=300s ./internal/auth ./internal/config ./internal/middleware
        working-directory: ./server

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 静态分析（flutter analyze）
        # 仅 error/warning 阻断；info 级（216 条）为已知可接受
        run: flutter analyze --no-pub --no-fatal-infos
        working-directory: ./frontend

      - name: 前端测试
        run: flutter test --no-pub
        working-directory: ./frontend

  # ── Job 1：构建 Web 并部署到腾讯云 Lighthouse ─────────────────────────
  deploy-web:
    name: 构建并部署到腾讯云 Lighthouse
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 Web 版本（注入百度/高德/腾讯地图 AK）
        env:
          BAIDU_AK: ${{ secrets.BAIDU_MAP_AK }}
          GAODE_AK: ${{ secrets.GAODE_MAP_AK }}
          TENXUN_AK: ${{ secrets.TENXUN_MAP_AK }}
        run: |
          # AK 优先取 GitHub Secrets，未配置则使用 build-all.ps1 中的公开值
          B_AK="${BAIDU_AK:-OUouSU6WbYExGTlnDEFqqruhTH60KAwO}"
          G_AK="${GAODE_AK:-a2f48050b8ec16aca88db4d25c035fe6}"
          T_AK="${TENXUN_AK:-E5IBZ-ZSUC3-EQN3G-R2B5G-A7H4J-TQFIR}"
          flutter build web --release \
            --web-renderer canvaskit \
            --dart-define=BAIDU_MAP_AK="$B_AK" \
            --dart-define=GAODE_MAP_AK="$G_AK" \
            --dart-define=TENXUN_MAP_AK="$T_AK"
        working-directory: ./frontend

      - name: 后处理：本地化 CanvasKit + 禁用 Service Worker
        # flutter_bootstrap.js 默认从 gstatic.com 加载 CanvasKit（国内被屏蔽
        # 导致白屏）且注册 Service Worker（HTTP 非 secure context 不可用）。
        # 替换为本地 /canvaskit/ 路径并去掉 SW 注册，与 build-all.ps1 逻辑一致。
        run: |
          python3 -c "
          import re
          p = 'frontend/build/web/flutter_bootstrap.js'
          t = open(p, encoding='utf-8').read()
          pattern = r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{\s*serviceWorkerVersion:\s*\"[^\"]*\"\s*\}\s*\}\);'
          replacement = '_flutter.loader.load({ config: { canvasKitBaseUrl: \"/canvaskit/\" } });'
          t2 = re.sub(pattern, replacement, t)
          if t2 == t:
              print('WARN: 未匹配到 serviceWorkerSettings，检查 Flutter 版本')
          else:
              print('OK: 已替换为本地 CanvasKit + 禁用 SW')
          open(p, 'w', encoding='utf-8').write(t2)
          "
          # 验证 CanvasKit 本地文件存在
          ls -la frontend/build/web/canvaskit/canvaskit.js frontend/build/web/canvaskit/canvaskit.wasm
          # 验证替换结果
          echo "canvasKitBaseUrl 出现次数: $(grep -c canvasKitBaseUrl frontend/build/web/flutter_bootstrap.js)"
          echo "serviceWorkerSettings 出现次数: $(grep -c serviceWorkerSettings frontend/build/web/flutter_bootstrap.js || true)"

      - name: 上传到腾讯云服务器
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "frontend/build/web/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/opt/wxx/frontend/web"
          EXCLUDE: "/downloads/"

  # ── Job 2：构建 Go 后端并部署到腾讯云 Lighthouse ───────────────────────
  deploy-server:
    name: 构建并部署后端到腾讯云
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 后端更新：服务器本地编译 + 重启（绕开 scp 挂起）。
      # systemd ExecStart=/opt/wxx/wxx-server（/etc/systemd/system/wxx.service），不是 bin/。
      # 说明：服务器访问 GitHub 的 git/codeload 不稳定（会超时）。git fetch 重试3次，失败则回退
      #       HTTPS tarball(codeload,无需凭据) 全新检出到 /tmp 编译；两者都失败则中止部署(job失败)，
      #       绝不静默用旧代码编译(避免"看似成功实则旧版")。
      - name: 服务器更新后端（服务器本地编译 + 重启）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 480s
          script: |
            set -e
            echo "=== 后端更新开始 $(date +%H:%M:%S) ==="
            cd /opt/wxx || exit 1
            # 1. 备份数据库（部署前）——实际架构为 MySQL，用 mysqldump；密码从 /etc/wxx/env 提取
            echo "--- 备份 MySQL 数据库 ---"
            DB_PW=$(grep '^DB_PASSWORD=' /etc/wxx/env | cut -d= -f2-)
            DB_NAME=$(grep '^DB_NAME=' /etc/wxx/env | cut -d= -f2-)
            mysqldump -h127.0.0.1 -uwxx -p"$DB_PW" "$DB_NAME" > "/opt/wxx/backup/wxx-pre-$(date +%Y%m%d%H%M).sql" 2>/dev/null && \
              echo "MySQL 备份完成: $(ls -la /opt/wxx/backup/wxx-pre-$(date +%Y%m%d%H%M).sql)" || echo "[warn] MySQL 备份失败(忽略，继续部署)"
            # 2. 获取最新源码（方法A:git fetch 重试3次；方法B(fetch全败):HTTPS tarball 下载到 /tmp 全新检出；都失败则 abort)
            echo "--- 获取最新源码(方法A:git fetch 重试3次) ---"
            FETCH_OK=0
            for i in 1 2 3; do
              echo "  第 $i 次 git fetch..."
              if timeout 60 git fetch origin main 2>&1; then
                FETCH_OK=1
                echo "  git fetch 成功"
                break
              else
                echo "  [warn] 第 $i 次 fetch 失败，重试"
              fi
              sleep 5
            done
            SRC_DIR=/opt/wxx  # 默认：git 仓库内编译
            if [ "$FETCH_OK" = "1" ]; then
              cd /opt/wxx
              if git reset --hard origin/main; then
                git log --oneline -1 | sed "s/^/  [OK] 已检出 origin\/main: /"
              else
                echo "  [ERROR] git reset --hard origin/main 失败"; git status; exit 1
              fi
            else
              echo "  [ERROR] git fetch 连续 3 次失败 —— 尝试方法B:HTTPS tarball(codeload,无需凭据) 全新检出到 /tmp"
              TAR_OK=0
              for i in 1 2 3; do
                echo "  第 $i 次 tarball 下载..."
                if timeout 90 curl -fsSL -o /tmp/wxx-main.tar.gz https://codeload.github.com/dll/wxx/tar.gz/refs/heads/main 2>&1; then
                  TAR_OK=1
                  break
                else
                  echo "  [warn] 第 $i 次 tarball 下载失败，重试"
                fi
                sleep 5
              done
              if [ "$TAR_OK" = "1" ]; then
                rm -rf /tmp/wxx-main && mkdir -p /tmp/wxx-main && tar xzf /tmp/wxx-main.tar.gz -C /tmp/wxx-main --strip-components=1
                test -f /tmp/wxx-main/server/cmd/server/main.go || { echo "  [ERROR] tarball 展开后缺少 server 源码"; exit 1; }
                SRC_DIR=/tmp/wxx-main
                echo "  [OK] tarball 全新检出到 $SRC_DIR(来自 main 最新源码)"
              else
                echo "  [ERROR] git fetch 与 tarball 下载均失败 —— 无法获取最新源码，中止部署(避免静默用旧版)"
                exit 1
              fi
            fi
            # 3. 编译（FTS5，与正式环境一致）
            echo "--- go build -tags fts5 (源码: $SRC_DIR) ---"
            export GOPROXY=https://goproxy.cn,direct
            cd "$SRC_DIR/server"
            if go build -tags fts5 -o /opt/wxx/wxx-server.new ./cmd/server 2>&1 | tail -15; then
              echo "  [OK] 编译完成"
            else
              echo "  [ERROR] go build 失败"; exit 1
            fi
            test -x /opt/wxx/wxx-server.new && echo "编译产物: $(ls -la /opt/wxx/wxx-server.new)" || (echo "[ERROR] 编译产物缺失"; exit 1)
            # 4. 停服务 → 替换 systemd 二进制 → 启动（迁移在启动时由 app.NewWithConfig 自动执行）
            chmod +x /opt/wxx/wxx-server.new
            echo "--- stop wxx ---"
            sudo systemctl stop wxx
            sleep 2
            cp /opt/wxx/wxx-server.new /opt/wxx/wxx-server
            # 5. 启动服务
            echo "--- start wxx ---"
            sudo systemctl start wxx
            sleep 5
            systemctl is-active wxx || true
            echo "--- 健康检查 ---"
            curl -s -m 8 localhost:8080/health && echo "" || echo "health check failed(忽略)"
            rm -f /opt/wxx/wxx-server.new



  # ── Job 3：构建 Android APK 并上传制品 ───────────────────────────────
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17（Android 构建依赖）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: ./frontend

      - name: 构建 APK（注入百度/高德/腾讯地图 AK）
        env:
          BAIDU_AK: ${{ secrets.BAIDU_MAP_AK }}
          GAODE_AK: ${{ secrets.GAODE_MAP_AK }}
          TENXUN_AK: ${{ secrets.TENXUN_MAP_AK }}
        run: |
          B_AK="${BAIDU_AK:-OUouSU6WbYExGTlnDEFqqruhTH60KAwO}"
          G_AK="${GAODE_AK:-a2f48050b8ec16aca88db4d25c035fe6}"
          T_AK="${TENXUN_AK:-E5IBZ-ZSUC3-EQN3G-R2B5G-A7H4J-TQFIR}"
          flutter build apk --release \
            --dart-define=BAIDU_MAP_AK="$B_AK" \
            --dart-define=GAODE_MAP_AK="$G_AK" \
            --dart-define=TENXUN_MAP_AK="$T_AK"
        working-directory: ./frontend

      - name: 读取版本号并重命名 APK
        run: |
          VERSION=$(grep "^version:" frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          # 固定名 weixiaoxin.apk：配合 releases/latest/download 固定下载入口，
          # 前端 release_config.dart 无需随版本改地址
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/weixiaoxin.apk
          # 版本化副本：GitHub 资产名强制 ASCII（实测中文名会被改成 default.apk），
          # 中文产品名「蔚小芯」展示在 Release 标题/说明与应用内下载名。
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "dist/weixiaoxin-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 上传 APK 制品（Actions 页面可下载，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: wxx-v${{ env.APK_VERSION }}-apk
          path: dist/*.apk
          retention-days: 30

      # APK 走 GitHub Release 分发，不再打进 Web 静态包（超 Pages 25MB 单文件限制）
      - name: 发布 GitHub Release（APK 分发入口）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APK_VERSION }}
          name: 蔚小芯 v${{ env.APK_VERSION }}
          body: |
            蔚小芯 Android 客户端 v${{ env.APK_VERSION }}

            下载：[蔚小芯 v${{ env.APK_VERSION }}](https://github.com/${{ github.repository }}/releases/download/v${{ env.APK_VERSION }}/weixiaoxin-v${{ env.APK_VERSION }}.apk)

            固定入口（始终指向最新版，应用内二维码使用）：
            https://github.com/${{ github.repository }}/releases/latest/download/weixiaoxin.apk

            Web 端：https://wxx-agent.online
          files: |
            dist/weixiaoxin.apk
            dist/weixiaoxin-v${{ env.APK_VERSION }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
