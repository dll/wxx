# 临时诊断：Caddy 服务状态
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断 Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 诊断 Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== Caddy 进程 ====="
            ps aux | grep caddy | grep -v grep || echo "无 caddy 进程"
            echo "===== Caddy 监听端口 ====="
            ss -tlnp | grep -E "80|443" || echo "无 80/443 监听"
            echo "===== Caddy 服务状态 ====="
            systemctl status caddy 2>&1 | head -15
            echo "===== Caddy 日志(最近) ====="
            journalctl -u caddy --no-pager -n 20 2>&1 | tail -25
