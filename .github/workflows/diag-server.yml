# 修复：移除未备案裸域名，重启 Caddy
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 修复 Caddy 配置
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 修复
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== 备份原 Caddyfile ====="
            sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak
            echo "===== 写入新 Caddyfile（仅 www，移除未备案裸域名块）====="
            sudo tee /etc/caddy/Caddyfile > /dev/null <<'CADDY'
# Caddy配置 — 蔚小芯腾讯云集中部署
# 仅服务 www.wxx-agent.online（裸域名 wxx-agent.online 未备案，
# 腾讯云 DNS 返回 webblock 拦截，ACME 无法签发证书，已移除其站点块）

www.wxx-agent.online {
	# API 反向代理优先：所有 /api/* 请求转发到 Go 后端，不参与 SPA fallback
	handle /api/* {
		reverse_proxy localhost:8080
	}

	# 其余请求服务静态文件（Flutter Web 构建产物）
	handle {
		root * /opt/wxx/frontend/web

		# SPA 路由回退：未匹配到静态文件的请求返回 index.html
		try_files {path} /index.html

		# 静态文件压缩
		encode zstd gzip
	}

	# 安全头
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy strict-origin-when-cross-origin
	}

	# 日志
	log {
		output file /var/log/caddy/wxx.log
		format json
	}
}
CADDY
            echo "===== 校验 Caddy 配置 ====="
            sudo caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -5
            echo "===== 重启 Caddy ====="
            sudo systemctl restart caddy
            sleep 3
            echo "===== Caddy 状态 ====="
            systemctl is-active caddy
            echo "===== 本地 HTTPS 测试 ====="
            curl -sk -m 8 -X POST "https://localhost/api/v1/auth/login" -H "Host: www.wxx-agent.online" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrong"}' -w "\nHTTP %{http_code}\n" | head -c 300
