name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 服务器完整登录测试
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 公网登录完整响应 ---"
            curl -sk -m 8 -X POST "https://www.wxx-agent.online/api/v1/auth/login" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' -w "\nHTTP %{http_code}\n" | head -c 400
            echo ""
            echo "--- 公网根路径 ---"
            curl -sk -m 8 -o /dev/null -w "HTTP %{http_code} 大小=%{size_download}\n" "https://www.wxx-agent.online/"
            echo "--- 后端进程健康 ---"
            curl -s -m 5 localhost:8080/health
            echo "DIAG_END"
