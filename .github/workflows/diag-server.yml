name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 查看被拒 IP 完整列表
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- YJ-FIREWALL-INPUT 完整规则 ---"
            sudo iptables -L YJ-FIREWALL-INPUT -n --line-numbers 2>/dev/null
            echo "--- 主链 INPUT 引用 ---"
            sudo iptables -L INPUT -n --line-numbers 2>/dev/null
            echo "--- 服务器当前公网可达性(本机自测) ---"
            curl -s -m 5 https://www.baidu.com -o /dev/null -w "外网出站: %{http_code}\n" 2>&1
            echo "DIAG_END"
