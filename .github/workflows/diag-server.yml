name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查防火墙与网络
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 防火墙规则 ---"
            sudo iptables -L -n 2>/dev/null | head -25
            echo "--- ufw 状态 ---"
            sudo ufw status 2>&1 | head -15
            echo "--- 安全组(腾讯云) ---"
            sudo cat /etc/firewall/ 2>/dev/null || echo "无"
            echo "--- caddy 监听详情 ---"
            sudo ss -tlnp | grep -E ":443|:80"
            echo "--- 服务器公网 IP ---"
            curl -s -m 5 ifconfig.me 2>/dev/null || curl -s -m 5 ip.sb 2>/dev/null || echo "无法获取"
            echo "DIAG_END"
