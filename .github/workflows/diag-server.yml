# 修复：检查证书文件与 Caddy 错误
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断证书
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 检查证书
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CERT=/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/www.wxx-agent.online/www.wxx-agent.online.crt
            echo "===== 证书文件权限 ====="
            ls -la $CERT
            echo "===== 证书内容(head) ====="
            sudo head -c 300 $CERT
            echo ""
            echo "===== caddy 用户/组 ====="
            ls -la /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/www.wxx-agent.online/
            echo "===== caddy 完整日志最近30行 ====="
            sudo journalctl -u caddy --no-pager -n 30 2>&1 | grep -iE "error|fail|tls|cert" | tail -20
