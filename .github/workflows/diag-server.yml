name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Caddy 完整重启与错误日志
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- caddy 最近错误日志 ---"
            sudo journalctl -u caddy --no-pager -n 40 2>&1 | grep -iE "tls|cert|handshake|error|alert|fail" | tail -20
            echo "--- 强制停止并重启 caddy ---"
            sudo systemctl stop caddy
            sleep 1
            sudo systemctl start caddy
            sleep 4
            systemctl is-active caddy
            echo "--- 重启后 HTTPS 测试 ---"
            curl -vsk -m 6 -X POST https://localhost/api/v1/auth/login -H "Host: www.wxx-agent.online" -H "Content-Type: application/json" -d '{"username":"a","password":"b"}' 2>&1 | grep -E "TLS|SSL|HTTP|error|Connected|Recv|< |code" | head -15
            echo "DIAG_END"
