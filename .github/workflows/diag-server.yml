# 临时诊断：查看腾讯云服务器上 Caddy 与后端状态
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断服务器
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 诊断服务器状态
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== Caddyfile ====="
            cat /etc/caddy/Caddyfile
            echo "===== Go 后端进程 ====="
            ps aux | grep -E "wxx|server|main" | grep -v grep || echo "无后端进程"
            echo "===== 8080 端口监听 ====="
            ss -tlnp | grep 8080 || echo "8080 未监听"
            echo "===== 后端 health ====="
            curl -s -m 5 localhost:8080/api/v1/health || echo "health 失败"
            echo ""
            echo "===== 前端目录 ====="
            ls /opt/wxx/frontend/web/ 2>/dev/null | head
