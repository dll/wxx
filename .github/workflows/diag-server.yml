name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 公网真实域名 HTTPS 测试
        run: |
          echo "===== 公网 www.wxx-agent.online ====="
          curl -sv --max-time 20 -X POST "https://www.wxx-agent.online/api/v1/auth/login" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' 2>&1 | grep -E "Connected|SSL|TLS|HTTP|error|Recv|< HTTP|code|message" | head -20
          echo ""
          echo "===== 公网根路径 ====="
          curl -s --max-time 20 -o /dev/null -w "HTTP %{http_code} 大小=%{size_download}\n" "https://www.wxx-agent.online/"
