name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 服务器自测公网登录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- 服务器访问自己的公网 HTTPS ---"
            curl -vsk -m 8 -X POST "https://www.wxx-agent.online/api/v1/auth/login" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' 2>&1 | grep -E "TLS|Connected|HTTP|error|code|message|Recv" | head -15
            echo "--- 服务器访问自己 IP 的 HTTPS(SNI) ---"
            curl -vsk -m 8 -X POST "https://129.211.223.113/api/v1/auth/login" -H "Host: www.wxx-agent.online" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' 2>&1 | grep -E "TLS|Connected|HTTP|error|code|message|Recv" | head -15
            echo "DIAG_END"
