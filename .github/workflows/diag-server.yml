# 临时诊断：查看腾讯云服务器 Caddy 配置与后端路由
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断服务器
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 诊断
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== Caddyfile 全文 ====="
            cat /etc/caddy/Caddyfile
            echo "===== 测试登录接口(本地) ====="
            curl -s -m 5 -X POST localhost:8080/api/v1/auth/login -H "Content-Type: application/json" -d '{"username":"student1","password":"wxx123456"}' | head -c 500
            echo ""
            echo "===== 测试 health 根路径 ====="
            curl -s -m 5 localhost:8080/api/health | head -c 300
            echo ""
            curl -s -m 5 localhost:8080/health | head -c 300
