name: Diag Server
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: HTTPS 精准诊断
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DIAG_BEGIN"
            echo "--- caddy version ---"
            caddy version
            echo "--- 证书有效期 ---"
            sudo openssl x509 -in /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/www.wxx-agent.online/www.wxx-agent.online.crt -noout -dates -subject -issuer 2>&1
            echo "--- 443 监听 ---"
            sudo ss -tlnp | grep :443
            echo "--- 本地 HTTPS 不带 Host ---"
            curl -vsk -m 6 https://localhost/ 2>&1 | grep -E "SSL|TLS|Connected|error|Recv|HTTP|subject|CN" | head -12
            echo "DIAG_END"
