# 临时诊断：从 CI 测试公网 HTTPS 访问腾讯云 API
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断公网访问
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 测试公网 HTTPS 登录接口
        run: |
          echo "===== www.wxx-agent.online 登录 ====="
          curl -s -m 30 -X POST "https://www.wxx-agent.online/api/v1/auth/login" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' -w "\nHTTP %{http_code}\n" | head -c 600
          echo ""
          echo "===== pages.dev 登录 ====="
          curl -s -m 30 -X POST "https://wxx-agent.pages.dev/api/v1/auth/login" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrongpass"}' -w "\nHTTP %{http_code}\n" | head -c 600
