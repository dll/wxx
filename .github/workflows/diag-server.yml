# 修复：移除未备案裸域名，重启 Caddy
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 修复 Caddy 配置
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 修复
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== 备份原 Caddyfile ====="
            sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak
            echo "===== 写入新 Caddyfile（base64 解码）====="
            echo "" | base64 -d | sudo tee /etc/caddy/Caddyfile > /dev/null
            echo "===== 校验 Caddy 配置 ====="
            sudo caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -5
            echo "===== 重启 Caddy ====="
            sudo systemctl restart caddy
            sleep 3
            echo "===== Caddy 状态 ====="
            systemctl is-active caddy
            echo "===== 本地 HTTPS 测试 ====="
            curl -sk -m 8 -X POST "https://localhost/api/v1/auth/login" -H "Host: www.wxx-agent.online" -H "Content-Type: application/json" -d '{"username":"student1","password":"wrong"}' -w "\nHTTP %{http_code}\n" | head -c 300
