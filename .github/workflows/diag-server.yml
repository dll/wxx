# 临时诊断：Caddyfile 全文 + 公网 HTTPS 测试
name: Diag Server

on:
  workflow_dispatch:

jobs:
  diag:
    name: 诊断
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 获取 Caddyfile
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== Caddyfile 全文 ====="
            cat /etc/caddy/Caddyfile
            echo "===== 本地 HTTPS 测试 ====="
            curl -sk -m 5 https://localhost/api/v1/auth/login -H "Host: www.wxx-agent.online" -X POST -H "Content-Type: application/json" -d '{"username":"x","password":"y"}' -w "\nHTTP %{http_code}\n" | head -c 300
            echo ""
            echo "===== www 证书 ====="
            ls -la /var/lib/caddy/.local/share/caddy/certificates/ 2>/dev/null || find / -name "*.crt" -path "*caddy*" 2>/dev/null | head
