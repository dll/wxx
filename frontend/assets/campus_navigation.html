<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滁州学院会峰校区 · 校园导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; height: 100vh; overflow: hidden; background: #f5f5f5;
    }

    /* ===== 左侧地图 ===== */
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    .map-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, #1677FF, #0958d9);
      color: #fff; padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .map-header-icon {
      width: 36px; height: 36px; background: rgba(255,255,255,.2);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .map-header-text h1 { font-size: 16px; font-weight: 600; }
    .map-header-text p  { font-size: 12px; opacity: .85; }

    .route-tabs {
      position: absolute; top: 70px; left: 12px; z-index: 100;
      display: flex; gap: 8px;
    }
    .route-tab {
      padding: 10px 16px; border-radius: 10px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .route-tab.active { background: #1677FF; color: #fff; }
    .route-tab:not(.active) { background: #fff; color: #666; }
    .route-tab:hover:not(.active) { background: #f0f5ff; color: #1677FF; }

    .map-legend {
      position: absolute; bottom: 20px; left: 12px; z-index: 100;
      background: #fff; border-radius: 10px; padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1); font-size: 12px;
    }
    .map-legend h4 { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #333; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: #666; }
    .legend-line { width: 20px; height: 3px; border-radius: 2px; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; }

    /* ===== 右侧步骤面板 ===== */
    .step-panel {
      width: 380px; background: #fff; border-left: 1px solid #e8e8e8;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #f0f5ff, #e6f7ff);
      border-bottom: 1px solid #e8e8e8;
    }
    .panel-header h2 { font-size: 18px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
    .panel-header .progress-text { font-size: 13px; color: #999; margin-top: 6px; }

    .progress-bar-container { padding: 16px 20px 0; }
    .progress-bar { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #1677FF, #52c41a); border-radius: 4px; transition: width .5s; }

    .step-list { flex: 1; overflow-y: auto; padding: 16px 20px; }

    .step-item {
      display: flex; gap: 14px; padding: 16px; border-radius: 14px;
      margin-bottom: 12px; transition: all .2s;
      border: 2px solid transparent; background: #fafafa;
    }
    .step-item.active   { background: #e6f7ff; border-color: #1677FF; box-shadow: 0 2px 8px rgba(22,119,255,.15); }
    .step-item.completed { background: #f6ffed; border-color: #b7eb8f; }
    .step-item.completed .step-number { background: #52c41a; }
    .step-item.locked { opacity: .6; cursor: not-allowed; }

    .step-number {
      width: 40px; height: 40px; border-radius: 50%; background: #1677FF;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(22,119,255,.3);
    }
    .step-item.completed .step-number::after { content: '✓'; font-size: 18px; }
    .step-item.completed .step-number span   { display: none; }
    .step-item.locked .step-number { background: #d9d9d9; }

    .step-content { flex: 1; min-width: 0; }
    .step-title   { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .step-item.completed .step-title { text-decoration: line-through; color: #999; }
    .step-location { font-size: 13px; color: #666; display: flex; align-items: center; gap: 4px; }
    .step-location::before { content: '📍'; font-size: 12px; }
    .step-desc { font-size: 12px; color: #999; margin-top: 4px; }

    .step-complete-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid #d9d9d9;
      background: #fff; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; transition: all .2s; align-self: center; font-size: 14px;
    }
    .step-complete-btn:hover { border-color: #52c41a; background: #f6ffed; }
    .step-item.completed .step-complete-btn { border-color: #52c41a; background: #52c41a; color: #fff; cursor: default; }
    .step-item.locked .step-complete-btn { cursor: not-allowed; opacity: .5; }

    .panel-footer {
      padding: 16px 20px; border-top: 1px solid #e8e8e8;
      display: flex; gap: 10px;
    }
    .btn {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-primary  { background: #1677FF; color: #fff; box-shadow: 0 2px 6px rgba(22,119,255,.3); }
    .btn-primary:hover { background: #0958d9; }
    .btn-outline  { background: #fff; color: #666; border: 1px solid #d9d9d9; }
    .btn-outline:hover { border-color: #1677FF; color: #1677FF; }
    .btn-success  { background: #52c41a; color: #fff; box-shadow: 0 2px 6px rgba(82,196,26,.3); }

    .celebration-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center;
    }
    .celebration-overlay.show { display: flex; }
    .celebration {
      background: #fff; border-radius: 24px; padding: 48px; text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,.25); max-width: 400px;
    }
    .celebration-icon { font-size: 72px; margin-bottom: 20px; }
    .celebration h2 { font-size: 24px; color: #1a1a1a; margin-bottom: 12px; }
    .celebration p  { font-size: 15px; color: #666; margin-bottom: 24px; line-height: 1.6; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .map-container { height: 50vh; }
      .step-panel    { width: 100%; height: 50vh; }
    }
  </style>
</head>
<body>

<!-- ========== 左侧地图 ========== -->
<div class="map-container">
  <div class="map-header">
    <div class="map-header-icon">🏫</div>
    <div class="map-header-text">
      <h1>滁州学院会峰校区</h1>
      <p>校园导航 · 校门到知行桥路线</p>
    </div>
  </div>

  <div class="route-tabs">
    <button class="route-tab active" id="tab1" onclick="switchRoute(1)">🚶 会峰门 → 知行桥</button>
    <button class="route-tab" id="tab2" onclick="switchRoute(2)">🚶 东门 → 知行桥</button>
  </div>

  <div id="map"></div>

  <div class="map-legend">
    <h4>📍 图例</h4>
    <div class="legend-item"><div class="legend-line" style="background:#1677FF;"></div>步行路线</div>
    <div class="legend-item"><div class="legend-dot" style="background:#C62828;"></div>校门入口</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1677FF;"></div>知行桥（终点）</div>
  </div>
</div>

<!-- ========== 右侧步骤面板 ========== -->
<div class="step-panel">
  <div class="panel-header">
    <h2>📋 报到流程</h2>
    <div class="progress-text" id="routeName">会峰门 → 知行桥</div>
    <div class="progress-text" id="progressText">已完成 0/2 步</div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="step-list" id="stepList"></div>

  <div class="panel-footer">
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
    <button class="btn btn-primary" id="nextBtn" onclick="completeNextStep()">✅ 完成当前步骤</button>
  </div>
</div>

<!-- 庆祝弹窗 -->
<div class="celebration-overlay" id="celebrationOverlay">
  <div class="celebration">
    <div class="celebration-icon">🎉</div>
    <h2>报到完成！</h2>
    <p>恭喜你完成所有报到流程！<br>欢迎来到滁州学院，开启你的大学生活！</p>
    <button class="btn btn-primary" onclick="closeCelebration()" style="flex:none;padding:12px 32px;">确定</button>
  </div>
</div>

<script>
// ============================================================
//  配置
// ============================================================
var AMAP_KEY = '3716dad3fec81f96d8b8a470d9ea0dbe';

var locations = {
  huifengGate: { lng: 118.307973, lat: 32.270833, name: '会峰门（南门）' },
  eastGate: { lng: 118.316595, lat: 32.276596, name: '东门' },
  zhixingBridge: { lng: 118.308221, lat: 32.273586, name: '知行桥' }
};

// 步骤数据（根据路线动态生成）
function getStepsByRoute(routeId) {
  var startGate = routeId === 1 ? locations.huifengGate : locations.eastGate;
  var startName = routeId === 1 ? '会峰门' : '东门';

  return [
    {
      id: 1,
      title: '校门报到',
      location: startName + '（学校门口）',
      description: '在' + startName + '，向志愿者出示录取通知书，完成签到',
      icon: '🚪',
      mapPos: startGate
    },
    {
      id: 2,
      title: '知行桥领取钥匙',
      location: '知行桥（校园中心）',
      description: '找到对应的学院报到点，领取宿舍钥匙',
      icon: '🔑',
      mapPos: locations.zhixingBridge
    }
  ];
}

var steps = getStepsByRoute(1);

// 状态
var completedSteps = new Set();
var currentStepId = 1;
var currentRouteId = 1;

// ============================================================
//  加载高德地图
// ============================================================
function loadAmapScript() {
  return new Promise(function(resolve, reject) {
    if (window.AMap && window.AMap.Map) { resolve(); return; }
    var script = document.createElement('script');
    script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + AMAP_KEY;
    script.onload = function() {
      if (AMap.plugin) {
        AMap.plugin('AMap.WalkingRoute', function() { resolve(); });
      } else { resolve(); }
    };
    script.onerror = function() { reject(new Error('脚本加载失败')); };
    document.head.appendChild(script);
  });
}

// ============================================================
//  地图初始化
// ============================================================
var map = null;

function initMap() {
  map = new AMap.Map('map', {
    zoom: 17, center: [118.3110, 32.2735],
    mapStyle: 'amap://styles/normal',
    features: ['bg', 'road', 'building', 'point'], viewMode: '2D'
  });
  map.setBounds(new AMap.Bounds([118.3020, 32.2660], [118.3220, 32.2810]));

  map.add(new AMap.Polygon({
    path: [[118.3030,32.2800],[118.3200,32.2800],[118.3200,32.2670],[118.3030,32.2670]],
    strokeColor: '#1677FF', strokeWeight: 2, strokeOpacity: .5, strokeStyle: 'dashed',
    fillColor: '#1677FF', fillOpacity: .03, bubble: true
  }));

  addMarker(locations.huifengGate, '🚪', '#C62828', '会峰门（南门）');
  addMarker(locations.eastGate, '🚪', '#C62828', '东门');
  addMarker(locations.zhixingBridge, '🔵', '#1677FF', '知行桥', 40, 200);
}

function makeIcon(emoji, bg, size) {
  size = size || 36;
  return '<div style="width:'+size+'px;height:'+size+'px;background:'+bg+';border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:'+(size*0.5)+'px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid white;">'+emoji+'</div>';
}

function addMarker(pos, emoji, bg, title, size, z) {
  var m = new AMap.Marker({
    position: [pos.lng, pos.lat], content: makeIcon(emoji, bg, size),
    offset: new AMap.Pixel(-(size||36)/2, -(size||36)/2), zIndex: z || 100
  });
  m.setMap(map); m.setTitle(title);
  m.on('click', function(){
    new AMap.InfoWindow({ content: '<div style="padding:10px;font-size:14px;font-weight:600;">'+title+'</div>', offset: new AMap.Pixel(0, -20) }).open(map, [pos.lng, pos.lat]);
  });
}

// ============================================================
//  步行路线规划
// ============================================================
var routePolylines = [];
var routeResults = {};

function clearRoutes() {
  routePolylines.forEach(function(p) { map.remove(p); });
  routePolylines = [];
}

function planWalkingRoute(origin, destination, callback) {
  if (typeof AMap.WalkingRoute === 'function') {
    var walker = new AMap.WalkingRoute(map, {
      onCallback: function(status, result) {
        if (status === 'complete' && result.routes && result.routes.length > 0) { callback(result); }
        else { useRestAPI(origin, destination, callback); }
      }
    });
    walker.search(new AMap.LngLat(origin.lng, origin.lat), new AMap.LngLat(destination.lng, destination.lat));
  } else {
    useRestAPI(origin, destination, callback);
  }
}

function useRestAPI(origin, destination, callback) {
  var url = 'https://restapi.amap.com/v3/direction/walking?origin=' +
    origin.lng + ',' + origin.lat + '&destination=' +
    destination.lng + ',' + destination.lat + '&key=' + AMAP_KEY;

  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    if (data.status === '1' && data.route && data.route.paths && data.route.paths.length > 0) {
      var path = data.route.paths[0];
      var steps = [];
      if (path.steps) {
        path.steps.forEach(function(step) {
          var stepPath = [];
          if (step.polyline) {
            step.polyline.split(';').forEach(function(p) {
              var c = p.split(',');
              if (c.length === 2) stepPath.push(new AMap.LngLat(parseFloat(c[0]), parseFloat(c[1])));
            });
          }
          steps.push({ path: stepPath });
        });
      }
      callback({ routes: [{ distance: parseInt(path.distance), time: parseInt(path.duration), steps: steps }] });
    } else { callback(null); }
  }).catch(function() { callback(null); });
}

function drawRoute(routeResult) {
  if (!routeResult || !routeResult.routes || !routeResult.routes.length) return null;
  var path = [];
  routeResult.routes[0].steps.forEach(function(step) {
    step.path.forEach(function(p) { path.push(p); });
  });
  var polyline = new AMap.Polyline({
    path: path, strokeColor: '#1677FF', strokeWeight: 8, strokeOpacity: 0.8,
    lineJoin: 'round', lineCap: 'round', showDir: true, bubble: true
  });
  map.add(polyline);
  routePolylines.push(polyline);
  return { distance: routeResult.routes[0].distance, time: routeResult.routes[0].time };
}

// ============================================================
//  路线切换
// ============================================================
function switchRoute(id) {
  currentRouteId = id;
  document.getElementById('tab1').className = 'route-tab' + (id===1?' active':'');
  document.getElementById('tab2').className = 'route-tab' + (id===2?' active':'');

  // 更新面板标题
  var routeName = id === 1 ? '会峰门 → 知行桥' : '东门 → 知行桥';
  document.getElementById('routeName').textContent = routeName;

  // 根据路线更新步骤数据
  steps = getStepsByRoute(id);
  completedSteps.clear();
  currentStepId = 1;
  updateStepUI();

  if (id === 1) { showRoute(locations.huifengGate, locations.zhixingBridge, 1); }
  else { showRoute(locations.eastGate, locations.zhixingBridge, 2); }
}

function showRoute(origin, dest, routeId) {
  if (routeResults[routeId]) {
    clearRoutes(); drawRoute(routeResults[routeId]); return;
  }
  planWalkingRoute(origin, dest, function(result) {
    if (result) { routeResults[routeId] = result; clearRoutes(); drawRoute(result); }
  });
}

// ============================================================
//  步骤逻辑（必须按顺序完成）
// ============================================================
function completeNextStep() {
  // 找到下一个未完成的步骤
  for (var i = 0; i < steps.length; i++) {
    if (!completedSteps.has(steps[i].id)) {
      completedSteps.add(steps[i].id);
      updateStepUI();

      // 如果还有下一步，自动切换路线并定位
      if (completedSteps.size < steps.length) {
        var nextStep = steps[completedSteps.size]; // 下一个步骤
        currentStepId = nextStep.id;

        // 切换到对应路线
        if (nextStep.id === 2) {
          // 第二步在知行桥，切换路线显示知行桥位置
          map.setZoomAndCenter(18, [nextStep.mapPos.lng, nextStep.mapPos.lat], false);
        }
      }

      // 检查是否全部完成
      if (completedSteps.size === steps.length) {
        setTimeout(function() {
          document.getElementById('celebrationOverlay').classList.add('show');
        }, 500);
      }
      return;
    }
  }
}

function resetAll() {
  completedSteps.clear();
  currentStepId = 1;
  document.getElementById('celebrationOverlay').classList.remove('show');
  updateStepUI();
  switchRoute(1);
}

function closeCelebration() {
  document.getElementById('celebrationOverlay').classList.remove('show');
}

function updateStepUI() {
  var c = completedSteps.size, t = steps.length;
  document.getElementById('progressBar').style.width = (c/t*100)+'%';
  document.getElementById('progressText').textContent = '已完成 '+c+'/'+t+' 步';

  var html = '';
  steps.forEach(function(s) {
    var done = completedSteps.has(s.id);
    var isCurrent = s.id === currentStepId && !done;
    var isLocked = !done && s.id !== currentStepId;

    var cls = 'step-item';
    if (done) cls += ' completed';
    else if (isCurrent) cls += ' active';
    else cls += ' locked';

    html += '<div class="'+cls+'">';
    html += '  <div class="step-number"><span>'+s.id+'</span></div>';
    html += '  <div class="step-content">';
    html += '    <div class="step-title">'+s.icon+' '+s.title+'</div>';
    html += '    <div class="step-location">'+s.location+'</div>';
    html += '    <div class="step-desc">'+s.description+'</div>';
    html += '  </div>';
    html += '  <button class="step-complete-btn" '+(done||isLocked?'disabled':'onclick="completeNextStep()"')+'>'+(done?'✓':'')+'</button>';
    html += '</div>';
  });
  document.getElementById('stepList').innerHTML = html;

  // 更新按钮
  var btn = document.getElementById('nextBtn');
  if (c === t) {
    btn.textContent = '🎉 全部完成';
    btn.className = 'btn btn-success';
    btn.disabled = true;
  } else {
    var nextStep = steps.find(function(s) { return !completedSteps.has(s.id); });
    btn.textContent = '✅ 完成：' + (nextStep ? nextStep.title : '');
    btn.className = 'btn btn-primary';
    btn.disabled = false;
  }
}

// ============================================================
//  主函数
// ============================================================
async function main() {
  try {
    await loadAmapScript();
    initMap();
    updateStepUI();
    setTimeout(function() { switchRoute(1); }, 1500);
  } catch (e) {
    console.error('初始化失败:', e);
  }
}

main();
</script>
</body>
</html>
