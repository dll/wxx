<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>校园报到导航 - 高德地图</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8eef4}
#map{position:absolute;top:0;left:0;width:100%;height:100%;min-height:300px}

/* ─── 脉冲标注动画 ─── */
@keyframes ripple1{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.4);opacity:0}}
@keyframes ripple2{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.1);opacity:0}}
.mk{position:absolute;width:44px;height:44px;transform:translate(-50%,-56px);cursor:pointer;z-index:100}
.mk-ring{position:absolute;inset:2px;border-radius:50%;border:2px solid;
  animation:ripple1 2s ease-out infinite}
.mk-ring.r2{animation:ripple2 2s ease-out infinite;animation-delay:.7s}
.mk-core{position:absolute;inset:10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform .15s ease}
.mk:hover .mk-core{transform:scale(1.18)}
.mk-label{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;color:#222;
  background:rgba(255,255,255,.93);padding:1px 6px;
  border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none}
.mk.st-pending .mk-ring{color:#1677FF;border-color:#1677FF}
.mk.st-pending .mk-core{background:#1677FF}
.mk.st-active  .mk-ring{color:#FF6B00;border-color:#FF6B00}
.mk.st-active  .mk-core{background:#FF6B00;transform:scale(1.25)}
.mk.st-active  .mk-ring{animation:ripple1 1.1s ease-out infinite}
.mk.st-active  .mk-ring.r2{animation:ripple2 1.1s ease-out infinite;animation-delay:.35s}
.mk.st-done    .mk-ring{color:#52C41A;border-color:#52C41A;animation:none;opacity:.5}
.mk.st-done    .mk-core{background:#52C41A}

/* ─── 编辑模式提示条 ─── */
#editHint{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.72);color:#fff;padding:5px 14px;
  border-radius:14px;font-size:12px;z-index:9999;
  opacity:0;transition:opacity .3s;pointer-events:none}
#editHint.show{opacity:1}

/* ─── 瓦片加载检测提示 ─── */
#tile-alert{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  max-width:420px;background:rgba(255,255,255,.96);color:#333;
  padding:10px 16px;border-radius:12px;font-size:12px;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;line-height:1.6}
#tile-alert.show{display:block}
#tile-alert .ta-title{font-weight:700;color:#d46b08;margin-bottom:4px}
#tile-alert .ta-body{color:#555}
#tile-alert .ta-body code{background:#fff3e0;color:#d46b08;padding:1px 4px;border-radius:3px;font-size:11px}
#tile-alert .ta-close{position:absolute;top:6px;right:10px;cursor:pointer;color:#999;font-size:16px}
</style>
</head>
<body>
<div id="map"></div>
<div id="tile-alert">
  <span class="ta-close" onclick="document.getElementById('tile-alert').classList.remove('show')">✕</span>
  <div class="ta-title">🗺️ 高德地图底图加载受限</div>
  <div class="ta-body">
    请检查：<br>
    1. AK 是否为 <code>Web端(JS API)</code> 类型<br>
    2. 域名白名单是否添加当前访问域名并保存<br>
    3. 保存后 1-2 分钟再刷新本页面
  </div>
</div>
<div id="editHint">📍 拖动标注调整位置，松手后坐标自动保存</div>

<script>
/* ════ 控制台静默：高德 JS API 在加载和运行时会有大量 console 输出，
 *   这里统一在脚本加载前重写 console 方法，避免污染浏览器控制台。════ */
(function(){
  var noop=function(){};
  try{
    if(window.console){
      console.log=noop;console.info=noop;console.debug=noop;
      console.trace=noop;
      /* 保留 console.warn 和 console.error 以便定位真实问题 */
    }
  }catch(e){}
})();

/* ════ 全局状态 ════ */
var _map=null,_mkrs=[],_poly=null,_steps=[],_cur=0,_mode='view';
var _campusId='huifeng',_campusBounds=null;
var _is3D=false;

/* ════ 校区完整范围（WGS-84 四至）════ */
var CAMPUS_BOUNDS={
  huifeng:{name:'会峰校区',
    north:32.2975,south:32.2885,east:118.3055,west:118.2940,
    center:{lat:32.2930,lng:118.2997},minZoom:16,defaultZoom:16},
  langya:{name:'琅琊校区',
    north:32.3190,south:32.3105,east:118.3150,west:118.3055,
    center:{lat:32.3145,lng:118.3102},minZoom:16,defaultZoom:16}
};
var ALL_BOUNDS={
  north:Math.max(CAMPUS_BOUNDS.huifeng.north,CAMPUS_BOUNDS.langya.north),
  south:Math.min(CAMPUS_BOUNDS.huifeng.south,CAMPUS_BOUNDS.langya.south),
  east:Math.max(CAMPUS_BOUNDS.huifeng.east,CAMPUS_BOUNDS.langya.east),
  west:Math.min(CAMPUS_BOUNDS.huifeng.west,CAMPUS_BOUNDS.langya.west)};

/* ════ 坐标转换：WGS-84 → GCJ-02（高德使用 GCJ-02）════ */
var π=Math.PI,_a=6378245,_ee=.006693421623;
function _dLat(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*π)+20*Math.sin(2*x*π))*2/3;
  r+=(20*Math.sin(y*π)+40*Math.sin(y/3*π))*2/3;
  r+=(160*Math.sin(y/12*π)+320*Math.sin(y/30*π))*2/3;return r}
function _dLng(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*π)+20*Math.sin(2*x*π))*2/3;
  r+=(20*Math.sin(x*π)+40*Math.sin(x/3*π))*2/3;
  r+=(150*Math.sin(x/12*π)+300*Math.sin(x/30*π))*2/3;return r}
function wgs2gcj(lng,lat){var dl=_dLat(lng-105,lat-35),dn=_dLng(lng-105,lat-35);
  var rl=lat*π/180,m=Math.sin(rl),m2=1-_ee*m*m,s=Math.sqrt(m2);
  return[lng+dn/((_a/s*Math.cos(rl)*π)/180),lat+dl/((_a*(1-_ee)/(m2*s)*π)/180)]}
/* 高德地图坐标与 GCJ-02 一致，无需再转 BD-09 */
function wgs2amap(lng,lat){return wgs2gcj(lng,lat)}
function amap2wgs(lng,lat){
  var g=wgs2gcj(lng,lat);
  /* 反推：近似一阶逆，精度足够标注拖动场景 */
  return[lng-(g[0]-lng),lat-(g[1]-lat)]}

/* ════ 瓦片加载检测 ════ */
var _tileWatchdog=null,_tileLoaded=false;
function startTileWatchdog(){
  var imgHandler=function(e){
    var img=e.target;if(!(img instanceof HTMLImageElement))return;
    var src=img.src||'';
    if(src.indexOf('amap.com')>-1||src.indexOf('autonavi.com')>-1){
      _tileLoaded=true;clearTileWatchdog()
    }
  };
  document.addEventListener('load',imgHandler,true);
  _tileWatchdog=setTimeout(function(){
    document.removeEventListener('load',imgHandler,true);
    if(!_tileLoaded){
      /* 兜底：检测高德 canvas 层是否有像素 */
      var rendered=false;
      document.querySelectorAll('#map canvas').forEach(function(c){
        try{
          var ctx=c.getContext('2d');
          if(ctx){var d=ctx.getImageData(c.width/2|0,c.height/2|0,1,1).data;
            if(d[0]>5||d[1]>5||d[2]>5)rendered=true}
        }catch(e){}
      });
      if(!rendered)showTileAlert();
    }
  },4000);
}
function clearTileWatchdog(){
  if(_tileWatchdog){clearTimeout(_tileWatchdog);_tileWatchdog=null}
}
function showTileAlert(){
  var el=document.getElementById('tile-alert');
  if(el)el.classList.add('show');
}

/* ════ 加载高德 JS API 2.0 ════ */
function loadAmap(ak){
  return new Promise(function(res,rej){
    if(window.AMap){res();return}
    var done=false;
    window._amap_init=function(){if(!done){done=true;res()}};
    setTimeout(function(){if(!done){done=true;rej(new Error('高德地图JS API加载超时'))}},7000);
    /* 高德 JS API 2.0：用 AMap Loader 方式加载更稳定 */
    var s=document.createElement('script');
    s.onerror=function(){if(!done){done=true;rej(new Error('高德地图JS API脚本加载失败'))}};
    s.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(ak)
      +'&callback=_amap_init&plugin=AMap.Scale,AMap.ToolBar,AMap.MapType,AMap.Polyline,AMap.Marker,AMap.Text';
    document.head.appendChild(s);
  });
}

/* ════ 创建脉冲标注 DOM ════ */
function buildMarkerDom(step,idx){
  var el=document.createElement('div');
  el.className='mk st-pending';
  el.innerHTML='<div class="mk-ring"></div><div class="mk-ring r2"></div>'
    +'<div class="mk-core">'+(idx+1)+'</div>'
    +'<div class="mk-label">'+step.location+'</div>';
  var self={idx:idx,el:el};
  el.addEventListener('click',function(e){e.stopPropagation();notify('step_selected',{index:idx})});
  if(_mode==='edit')bindDrag(self);
  return el;
}
function setMarkerStatus(el,s){
  if(el)el.className='mk st-'+s;
}
function bindDrag(self){
  /* 高德地图 Marker 拖动用 AMap.Marker 标记 setDraggable(true) + dragend 事件更可靠 */
  self.el.style.cursor='move';
}

/* ════ 校园全图取景 ════ */
function fitCampus(){
  if(!_map)return;
  var b=null;
  if(_campusBounds){
    var sw=wgs2amap(_campusBounds.west,_campusBounds.south);
    var ne=wgs2amap(_campusBounds.east,_campusBounds.north);
    b=new AMap.Bounds([sw[0],sw[1]],[ne[0],ne[1]]);
  }
  if(!b){
    var mnLat=1e9,mxLat=-1e9,mnLng=1e9,mxLng=-1e9,has=false;
    _steps.forEach(function(s){
      var p=wgs2amap(s.lng,s.lat);
      if(p[1]<mnLat)mnLat=p[1];if(p[1]>mxLat)mxLat=p[1];
      if(p[0]<mnLng)mnLng=p[0];if(p[0]>mxLng)mxLng=p[0];has=true});
    if(has){
      mnLat-=.003;mxLat+=.003;mnLng-=.003;mxLng+=.003;
      b=new AMap.Bounds([mnLng,mnLat],[mxLng,mxLat]);
    }
  }
  if(!b){
    var s1=wgs2amap(ALL_BOUNDS.west,ALL_BOUNDS.south);
    var n1=wgs2amap(ALL_BOUNDS.east,ALL_BOUNDS.north);
    b=new AMap.Bounds([s1[0],s1[1]],[n1[0],n1[1]]);
  }
  try{_map.setBounds(b)}catch(e){
    try{_map.setFitView()}catch(e2){}
  }
  if(_campusBounds){
    var z=_map.getZoom();
    var cz=CAMPUS_BOUNDS[_campusId]||_campusBounds;
    if(z<cz.minZoom)_map.setZoom(cz.minZoom);
    if(z>18)_map.setZoom(18);
  }
}

/* ════ 切换校区 ════ */
function fitCampusById(id){
  if(id && CAMPUS_BOUNDS[id]){_campusId=id;_campusBounds=CAMPUS_BOUNDS[id]}
  else if(id==='all'){_campusId='all';_campusBounds=ALL_BOUNDS}
  fitCampus();
}

/* ════ 地图初始化（AMap 2.0）════ */
function initMap(steps,cur,mode,campusId){
  // 确保容器有尺寸：AMap 在 0×0 容器中初始化会导致瓦片不渲染。
  // Flutter iframe 存在同步问题，init 消息可能在容器尺寸还是 0 时到达。
  var mapEl=document.getElementById('map');
  var rect=mapEl.getBoundingClientRect();
  if(rect.width<10||rect.height<10){
    setTimeout(function(){initMap(steps,cur,mode,campusId)},100);
    return;
  }
  _steps=steps||[];_cur=cur||0;_mode=mode||'view';

  if(campusId && CAMPUS_BOUNDS[campusId]){
    _campusId=campusId;_campusBounds=CAMPUS_BOUNDS[campusId];
  } else if(_steps && _steps.length){
    var lat0=_steps[0].lat;
    _campusId=(lat0>=32.305)?'langya':'huifeng';
    _campusBounds=CAMPUS_BOUNDS[_campusId];
  } else {
    _campusId='huifeng';_campusBounds=CAMPUS_BOUNDS.huifeng;
  }

  var cc=wgs2amap(_campusBounds.center.lng,_campusBounds.center.lat);
  _map=new AMap.Map('map',{
    zoom:_campusBounds.defaultZoom||16,
    center:[cc[0],cc[1]],
    viewMode:'2D',
    resizeEnable:true,
    showLabel:true
  });
  _map.setMinZoom(13);_map.setMaxZoom(20);

  /* 控件 */
  try{
    _map.addControl(new AMap.Scale());
    _map.addControl(new AMap.ToolBar({position:'RT'}));
    _map.addControl(new AMap.MapType({defaultType:0,showTraffic:false,showRoad:false}));
  }catch(e){}

  /* 容器尺寸变化时重取景 */
  if(typeof ResizeObserver!=='undefined'){
    var obs=new ResizeObserver(function(){if(_map){fitCampus()}});
    obs.observe(document.getElementById('map'))
  }

  /* 延迟一帧再开始取景 */
  var tries=0;
  function tryFit(){
    tries++;
    var sz=_map.getSize();
    var h=(sz && sz.height)||0;
    if(h>200){fitCampus();}
    else if(tries<10){setTimeout(tryFit,150);}
    else{fitCampus();}
  }
  tryFit();

  startTileWatchdog();
  renderSteps();
  if(mode==='edit'){
    var h=document.getElementById('editHint');
    if(h){h.classList.add('show');setTimeout(function(){h.classList.remove('show')},3500)}
  }
  notify('ready',{});
}

/* ════ 渲染步骤标注 + 路线 ════ */
function renderSteps(){
  _mkrs.forEach(function(m){try{_map.remove(m)}catch(e){}});_mkrs=[];
  if(_poly){try{_map.remove(_poly)}catch(e){}_poly=null}
  var pts=[];
  _steps.forEach(function(s,i){
    var g=wgs2amap(s.lng,s.lat);
    var pt=[g[0],g[1]];
    pts.push(pt);
    try{
      var dom=buildMarkerDom(s,i);
      var m=new AMap.Marker({
        position:pt,
        content:dom,
        offset:new AMap.Pixel(-22,-50),
        draggable:_mode==='edit'
      });
      m._idx=i;
      m.on('dragging',function(e){
        var pos=e.lnglat||m.getPosition();
        /* 拖动时实时更新位置 */
      });
      m.on('dragend',function(e){
        var pos=m.getPosition();
        var w=amap2wgs(pos.lng,pos.lat);
        notify('marker_moved',{index:i,lat:w[1],lng:w[0]})
      });
      _map.add(m);_mkrs.push(m);
    }catch(e){}
  });
  if(pts.length>1){
    try{
      _poly=new AMap.Polyline({
        path:pts,
        strokeColor:'#1677FF',strokeWeight:3,
        strokeOpacity:.6,strokeStyle:'dashed',
        strokeDasharray:[10,5]
      });
      _map.add(_poly);
    }catch(e){}
  }
  updateStatus();
}

function updateStatus(){
  _mkrs.forEach(function(m,i){
    try{setMarkerStatus(m.getContent(),i<_cur?'done':i===_cur?'active':'pending')}catch(e){}
  });
}

/* ════ 切换当前步骤 ════ */
function setStep(idx){
  _cur=idx||0;updateStatus();
  if(_mkrs[idx]){
    try{_map.panTo(_mkrs[idx].getPosition())}catch(e){}
  }
}

/* ════ 2D / 3D 视角切换 ════ */
function set3DMode(enabled){
  _is3D=!!enabled;
  if(!_map||typeof AMap==='undefined')return;
  try{
    if(_is3D){
      _map.setPitch(60);
      _map.setRotation(-20);
      _map.setFeatures(['bg','road','building']);
    } else {
      _map.setPitch(0);
      _map.setRotation(0);
      _map.setFeatures(['bg','road','building']);
    }
  }catch(e){
    try{if(_is3D){_map.setPitch(60)}else{_map.setPitch(0)}}catch(e2){}
  }
}

/* ════ 与 Flutter 通信 ════ */
function notify(type,data){
  var msg=Object.assign({type:type},data||{});
  if(typeof FlutterBridge!=='undefined'){
    try{FlutterBridge.postMessage(JSON.stringify(msg))}catch(e){}
  }
  try{(window.parent||window.top||window).postMessage(msg,'*')}catch(e){}
}

/* ════ 消息路由 ════
 * 地图在 window.load 时自动初始化（内嵌 AK），不依赖 init 消息传 AK。
 * init 消息仅用于更新 steps/campus/mode 等业务数据。
 */
var _pendingInit=null;

window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='init'){
    if(_map){
      _steps=d.steps||_steps;
      _cur=d.currentStep!=null?d.currentStep:_cur;
      _mode=d.mode||_mode;
      if(d.campusId&&d.campusId!==_campusId){
        fitCampusById(d.campusId);
      }else{
        fitCampus(); // 同校区也重新取景，确保地图范围与校园范围一致
      }
      renderSteps();
    }else{
      _pendingInit=d;
    }
  } else if(d.type==='set_step'){
    setStep(d.index||0);
  } else if(d.type==='refresh'){
    _steps=d.steps||_steps;
    _cur=d.currentStep!=null?d.currentStep:_cur;
    renderSteps();
  } else if(d.type==='fit_campus'){
    fitCampusById(d.campusId||d.id);
  } else if(d.type==='set_3d'){
    set3DMode(d.enabled===true);
  }
});

/* ════ URL 参数读取 ════ */
function _getUrlParam(name){
  try{
    var u=new URL(window.location.href);
    return u.searchParams.get(name)||'';
  }catch(e){return ''}
}

/* ════ 自动初始化 ════ */
var _DEFAULT_AMAP_AK='a2f48050b8ec16aca88db4d25c035fe6';

window.addEventListener('load',function(){
  var ak=_getUrlParam('ak')||_DEFAULT_AMAP_AK;
  var campus=_getUrlParam('campus')||'huifeng';
  loadAmap(ak).then(function(){
    var data=_pendingInit||{};
    var cid=data.campusId||campus||'huifeng';
    initMap(data.steps||[],data.currentStep||0,data.mode||'view',cid);
    setTimeout(function(){notify('ready',{})},200);
  }).catch(function(err){
    showTileAlert();
  });
});
</script>
</body>
</html>
