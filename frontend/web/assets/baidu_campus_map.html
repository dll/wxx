<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>校园报到导航</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8eef4}
#map{position:absolute;top:0;left:0;width:100%;height:100%;min-height:300px}

/* ─── 脉冲标注动画（GL版外层容器会被百度BMapGL托管位置，这里只写标注本身样式）─── */
@keyframes ripple1{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.4);opacity:0}}
@keyframes ripple2{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.1);opacity:0}}
.mk{position:absolute;width:44px;height:44px;transform:translate(-50%,-56px);cursor:pointer;z-index:100}
.mk-ring{position:absolute;inset:2px;border-radius:50%;border:2px solid;
  animation:ripple1 2s ease-out infinite}
.mk-ring.r2{animation:ripple2 2s ease-out infinite;animation-delay:.7s}
.mk-core{position:absolute;inset:10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform .15s ease}
.mk:hover .mk-core{transform:scale(1.18)}
.mk-label{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;color:#222;
  background:rgba(255,255,255,.93);padding:1px 6px;
  border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none}
.mk.st-pending .mk-ring{color:#1677FF;border-color:#1677FF}
.mk.st-pending .mk-core{background:#1677FF}
.mk.st-active  .mk-ring{color:#FF6B00;border-color:#FF6B00}
.mk.st-active  .mk-core{background:#FF6B00;transform:scale(1.25)}
.mk.st-active  .mk-ring{animation:ripple1 1.1s ease-out infinite}
.mk.st-active  .mk-ring.r2{animation:ripple2 1.1s ease-out infinite;animation-delay:.35s}
.mk.st-done    .mk-ring{color:#52C41A;border-color:#52C41A;animation:none;opacity:.5}
.mk.st-done    .mk-core{background:#52C41A}

/* ─── 编辑模式提示条 ─── */
#editHint{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.72);color:#fff;padding:5px 14px;
  border-radius:14px;font-size:12px;z-index:9999;
  opacity:0;transition:opacity .3s;pointer-events:none}
#editHint.show{opacity:1}

/* ─── 瓦片加载检测提示 ─── */
#tile-alert{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  max-width:420px;background:rgba(255,255,255,.96);color:#333;
  padding:10px 16px;border-radius:12px;font-size:12px;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;line-height:1.6}
#tile-alert.show{display:block}
#tile-alert .ta-title{font-weight:700;color:#d46b08;margin-bottom:4px}
#tile-alert .ta-body{color:#555}
#tile-alert .ta-body code{background:#fff3e0;color:#d46b08;padding:1px 4px;border-radius:3px;font-size:11px}
#tile-alert .ta-close{position:absolute;top:6px;right:10px;cursor:pointer;color:#999;font-size:16px}
</style>
</head>
<body>
<div id="map"></div>
<div id="tile-alert">
  <span class="ta-close" onclick="document.getElementById('tile-alert').classList.remove('show')">✕</span>
  <div class="ta-title">🗺️ 百度地图底图加载受限</div>
  <div class="ta-body">
    请检查：<br>
    1. AK 是否为 <code>浏览器端（JS API GL / 3.0）</code> 类型<br>
    2. Referer 白名单是否添加 <code>*</code> 并保存<br>
    3. 保存后 1-2 分钟再刷新本页面
  </div>
</div>
<div id="editHint">📍 拖动标注调整位置，松手后坐标自动保存</div>

<script>
/* ════ 控制台静默：百度地图 JS API GL 在加载和运行时会输出大量提示信息
 *   （如 BMapGL framework loaded、tile 加载状态、SDK 版本等），这里在脚本
 *   加载前统一重写 console 方法，避免污染浏览器控制台。error 保留以便定位
 *   真实问题，但百度的 error 多为跨域警告，不影响地图渲染。════ */
(function(){
  var noop=function(){};
  try{
    if(window.console){
      console.log=noop;console.info=noop;console.debug=noop;
      console.trace=noop;
      /* 保留 console.warn 和 console.error 以便定位真实问题 */
    }
  }catch(e){}
})();

/* ════ 全局状态 ════ */
var _map=null,_ovs=[],_poly=null,_steps=[],_cur=0,_mode='view';
var _campusId='huifeng',_campusBounds=null;
var π=Math.PI,_a=6378245,_ee=.006693421623;
/* 百度 GL 版直接使用 BD-09 经纬度（同 v2.0） */

/* ════ 校区范围（WGS-84 四至，来源：OpenStreetMap 权威数据 2026-08）════
 * 会峰校区：丰乐大道1528号，南谯区凤凰街道，中心 32.2743/118.3055
 *   OSM way 734826227，四至 N32.2803/S32.2688/E118.3120/W118.2986
 * 琅琊校区：琅琊西路2号，琅琊区，中心 32.2943/118.2978
 *   OSM way 734826234，四至 N32.2962/S32.2913/E118.3005/W118.2931
 * 注意：此前代码将会峰/琅琊坐标写反，且琅琊坐标偏移到校区以北 2km
 *   处（32.314），已按 OSM 权威数据纠正。
 */
var CAMPUS_BOUNDS={
  huifeng:{name:'会峰校区',
    north:32.2803,south:32.2688,east:118.3120,west:118.2986,
    center:{lat:32.2743,lng:118.3055},minZoom:14,defaultZoom:16},
  langya:{name:'琅琊校区',
    north:32.2962,south:32.2913,east:118.3005,west:118.2931,
    center:{lat:32.2943,lng:118.2978},minZoom:15,defaultZoom:17}
};
var ALL_BOUNDS={
  north:Math.max(CAMPUS_BOUNDS.huifeng.north,CAMPUS_BOUNDS.langya.north),
  south:Math.min(CAMPUS_BOUNDS.huifeng.south,CAMPUS_BOUNDS.langya.south),
  east:Math.max(CAMPUS_BOUNDS.huifeng.east,CAMPUS_BOUNDS.langya.east),
  west:Math.min(CAMPUS_BOUNDS.huifeng.west,CAMPUS_BOUNDS.langya.west)};

/* ════ 坐标转换 ════ */
function _dLat(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*π)+20*Math.sin(2*x*π))*2/3;
  r+=(20*Math.sin(y*π)+40*Math.sin(y/3*π))*2/3;
  r+=(160*Math.sin(y/12*π)+320*Math.sin(y/30*π))*2/3;return r}
function _dLng(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*π)+20*Math.sin(2*x*π))*2/3;
  r+=(20*Math.sin(x*π)+40*Math.sin(x/3*π))*2/3;
  r+=(150*Math.sin(x/12*π)+300*Math.sin(x/30*π))*2/3;return r}
function wgs2gcj(lng,lat){var dl=_dLat(lng-105,lat-35),dn=_dLng(lng-105,lat-35);
  var rl=lat*π/180,m=Math.sin(rl),m2=1-_ee*m*m,s=Math.sqrt(m2);
  return[lng+dn/((_a/s*Math.cos(rl)*π)/180),lat+dl/((_a*(1-_ee)/(m2*s)*π)/180)]}
function gcj2bd(lng,lat){
  var z=Math.sqrt(lng*lng+lat*lat)+2e-5*Math.sin(lat*π*3e3/180);
  var t=Math.atan2(lat,lng)+3e-6*Math.cos(lng*π*3e3/180);
  return[z*Math.cos(t)+.0065,z*Math.sin(t)+.006]}
function wgs2bd(lng,lat){var g=wgs2gcj(lng,lat);return gcj2bd(g[0],g[1])}
function bd2wgs(lng,lat){
  var x=lng-.0065,y=lat-.006;
  var z=Math.sqrt(x*x+y*y)-2e-5*Math.sin(y*π*3e3/180);
  var t=Math.atan2(y,x)-3e-6*Math.cos(x*π*3e3/180);
  var gcj=[z*Math.cos(t),z*Math.sin(t)];
  var g2=wgs2gcj(gcj[0],gcj[1]);
  return[gcj[0]-(g2[0]-gcj[0]),gcj[1]-(g2[1]-gcj[1])]}

/* ════ 瓦片加载检测 ════ */
var _tileWatchdog=null,_tileLoaded=false;
function startTileWatchdog(){
  // 监听图片load事件：只要百度瓦片有加载成功就算底图正常
  var imgHandler=function(e){
    var img=e.target;if(!(img instanceof HTMLImageElement))return;
    var src=img.src||'';
    if(src.indexOf('map.baidu.com')>-1||src.indexOf('bdimg.com')>-1||src.indexOf('api.map.baidu.com')>-1){
      _tileLoaded=true;clearTileWatchdog()
    }
  };
  document.addEventListener('load',imgHandler,true);

  _tileWatchdog=setTimeout(function(){
    document.removeEventListener('load',imgHandler,true);
    // 兜底：BMapGL 用 WebGL canvas 渲染，getContext('2d') 返回 null。
    // 改为检测 canvas 存在且尺寸有效，即认为底图在渲染。
    var canvases=document.querySelectorAll('#map canvas');
    var rendered=false;
    canvases.forEach(function(c){
      if(c.width>100&&c.height>100)rendered=true;
    });
    // 同时检测 BMapGL 渲染容器（.BMap_mask 等元素存在说明地图已渲染）
    if(!rendered){
      var maskEl=document.querySelector('#map .BMap_mask');
      if(maskEl)rendered=true;
    }
    if(!_tileLoaded && !rendered){
      showTileAlert();
    }
  },6000);
}
function clearTileWatchdog(){
  if(_tileWatchdog){clearTimeout(_tileWatchdog);_tileWatchdog=null}
}
function showTileAlert(){
  var el=document.getElementById('tile-alert');
  if(el)el.classList.add('show');
}

/* ════ 加载百度 GL JS API（type=webgl，新版AK必须用这个）════
 * 注意：JS API GL 版不再使用 BMap 全局，改用 BMapGL。
 * 新创建的百度「浏览器端」AK 默认只支持 GL 版本。
 * ════ */
function loadBaiduGL(ak){
  return new Promise(function(res,rej){
    if(window.BMapGL){res();return}
    var done=false;
    window._bmapgl_init=function(){if(!done){done=true;res()}};
    setTimeout(function(){if(!done){done=true;rej(new Error('百度地图JS API GL加载超时'))}},7000);
    var s=document.createElement('script');
    s.onerror=function(){if(!done){done=true;rej(new Error('百度地图JS API GL脚本加载失败'))}};
    s.src='https://api.map.baidu.com/api?type=webgl&v=1.0&ak='+encodeURIComponent(ak)+'&callback=_bmapgl_init';
    document.head.appendChild(s);
  });
}

/* ════ GL 版：自定义脉冲 HTML 覆盖物 ════
 * 注意：BMapGL 是异步加载的，脚本顶层不能用 BMapGL 定义原型！
 * 必须在 BMapGL 加载完成后（initMap 里）调用 setupPulseOv() 才安全。
 * ════ */
function PulseOverlay(bdPt,step,idx){
  /* bdPt 已经是 BD-09 坐标 */
  this._pt=bdPt;this._step=step;this._idx=idx;this._el=null;
}
var _pulseOvReady=false;
function setupPulseOv(){
  if(_pulseOvReady||typeof BMapGL==='undefined'||!BMapGL.Overlay)return;
  _pulseOvReady=true;
  PulseOverlay.prototype=new BMapGL.Overlay();
  PulseOverlay.prototype.initialize=function(map){
    this._map=map;
    var el=document.createElement('div');
    el.className='mk st-pending';
    el.innerHTML='<div class="mk-ring"></div><div class="mk-ring r2"></div>'
      +'<div class="mk-core">'+(this._idx+1)+'</div>'
      +'<div class="mk-label">'+this._step.location+'</div>';
    var self=this;
    el.addEventListener('click',function(e){e.stopPropagation();notify('step_selected',{index:self._idx})});
    if(_mode==='edit')this._bindDrag(el);
    this._el=el;
    map.getPanes().markerPane.appendChild(el);
    return el;
  };
  PulseOverlay.prototype.draw=function(){
    if(!this._el||!this._map)return;
    var pixel=this._map.pointToOverlayPixel(this._pt);
    this._el.style.left=pixel.x+'px';
    this._el.style.top=pixel.y+'px';
  };
  PulseOverlay.prototype.setStatus=function(s){
    if(this._el)this._el.className='mk st-'+s;
  };
  PulseOverlay.prototype._bindDrag=function(el){
    var self=this,dragging=false,sx=0,sy=0,op=null;
    el.style.cursor='move';
    el.addEventListener('mousedown',function(e){
      dragging=true;sx=e.clientX;sy=e.clientY;
      op=self._map.pointToPixel(self._pt);e.preventDefault()});
    document.addEventListener('mousemove',function(e){
      if(!dragging)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      self._pt=self._map.pixelToPoint({x:op.x+dx,y:op.y+dy});
      self.draw()});
    document.addEventListener('mouseup',function(){
      if(!dragging)return;dragging=false;
      var w=bd2wgs(self._pt.lng,self._pt.lat);
      notify('marker_moved',{index:self._idx,lat:w[1],lng:w[0]})
    });
  };
}

/* ════ 校园全图取景（GL版）════
 * GL 版 setViewport(bounds,{margins}) 用法与 v2.0 基本一致；
 * 若 setViewport 行为异常，则退化为 fitBounds + setZoom 手动对齐。
 * ════ */
function fitCampus(){
  if(!_map)return;
  var b=null;
  if(_campusBounds){
    var sw=wgs2bd(_campusBounds.west,_campusBounds.south);
    var ne=wgs2bd(_campusBounds.east,_campusBounds.north);
    b=new BMapGL.Bounds(new BMapGL.Point(sw[0],sw[1]),new BMapGL.Point(ne[0],ne[1]));
  }
  if(!b){
    var mnLat=1e9,mxLat=-1e9,mnLng=1e9,mxLng=-1e9,has=false;
    _steps.forEach(function(s){
      var p=wgs2bd(s.lng,s.lat);
      if(p[1]<mnLat)mnLat=p[1];if(p[1]>mxLat)mxLat=p[1];
      if(p[0]<mnLng)mnLng=p[0];if(p[0]>mxLng)mxLng=p[0];has=true});
    if(has){
      mnLat-=.003;mxLat+=.003;mnLng-=.003;mxLng+=.003;
      b=new BMapGL.Bounds(new BMapGL.Point(mnLng,mnLat),new BMapGL.Point(mxLng,mxLat));
    }
  }
  if(!b){
    var s1=wgs2bd(ALL_BOUNDS.west,ALL_BOUNDS.south);
    var n1=wgs2bd(ALL_BOUNDS.east,ALL_BOUNDS.north);
    b=new BMapGL.Bounds(new BMapGL.Point(s1[0],s1[1]),new BMapGL.Point(n1[0],n1[1]));
  }
  var w=_map.getSize().width||400,h=_map.getSize().height||400;
  // 减小边距让校园范围更贴边，地图视觉放大（原 12%/15% 边距过大）。
  var mgH=Math.max(16,Math.round(w*0.04));
  var mgV=Math.max(18,Math.round(h*0.05));
  try{
    _map.setViewport(b,{margins:[mgV,mgH,mgV,mgH]});
  }catch(e){
    // 部分 GL 版本 setViewport 不支持 margins，退化到 fitBounds
    _map.fitBounds(b,[mgV,mgH,mgV,mgH]);
  }
  // zoom 限制：仅限制最大缩放，不强制 minZoom，确保地图范围与校园范围一致
  if(_campusBounds){
    var z=_map.getZoom();
    if(z>20)_map.setZoom(20);
  }
}

/* ════ 切换校区 ════ */
function fitCampusById(id){
  if(id && CAMPUS_BOUNDS[id]){_campusId=id;_campusBounds=CAMPUS_BOUNDS[id]}
  else if(id==='all'){_campusId='all';_campusBounds=ALL_BOUNDS}
  fitCampus();
}

/* ════ 地图初始化（BMapGL）════ */
function initMap(steps,cur,mode,campusId){
  // 确保容器有尺寸：BMapGL 在 0×0 容器中初始化时 WebGL 上下文创建失败，
  // 后续尺寸变化也不会渲染瓦片。Flutter iframe 存在同步问题，init 消息
  // 可能在容器尺寸还是 0 时到达，必须等待容器有尺寸再初始化。
  var mapEl=document.getElementById('map');
  var rect=mapEl.getBoundingClientRect();
  if(rect.width<10||rect.height<10){
    setTimeout(function(){initMap(steps,cur,mode,campusId)},100);
    return;
  }
  setupPulseOv(); // BMapGL 已就绪，此时才能安全定义覆盖物原型
  _steps=steps||[];_cur=cur||0;_mode=mode||'view';

  // 校区推断
  if(campusId && CAMPUS_BOUNDS[campusId]){
    _campusId=campusId;_campusBounds=CAMPUS_BOUNDS[campusId];
  } else if(_steps && _steps.length){
    var lat0=_steps[0].lat;
    // 阈值 32.285：会峰校区北界 32.2803 < 32.285 < 琅琊校区南界 32.2913
    _campusId=(lat0>=32.285)?'langya':'huifeng';
    _campusBounds=CAMPUS_BOUNDS[_campusId];
  } else {
    _campusId='huifeng';_campusBounds=CAMPUS_BOUNDS.huifeng;
  }

  // 初始化 GL 地图
  var cc=wgs2bd(_campusBounds.center.lng,_campusBounds.center.lat);
  _map=new BMapGL.Map('map',{
    enableMapClick:true,
    displayOptions:{
      building:false,    // 关闭3D楼块（避免卡顿）
      poi:true,
      road:true
    }
  });
  _map.enableScrollWheelZoom();
  _map.enableDragging();
  _map.setMinZoom(13);_map.setMaxZoom(21);

  // 默认中心 + zoom（先锁定视角，避免初帧跑偏）
  _map.centerAndZoom(new BMapGL.Point(cc[0],cc[1]),_campusBounds.defaultZoom||16);

  // 控件（GL版命名空间：BMapGL 下的 ScaleControl / ZoomControl 等）
  try{
    _map.addControl(new BMapGL.ScaleControl({anchor:BMAP_ANCHOR_BOTTOM_LEFT}));
    _map.addControl(new BMapGL.ZoomControl({
      anchor:BMAP_ANCHOR_TOP_RIGHT,type:BMAP_ZOOMCONTROL_TYPE_SMALL
    }));
    // 地图类型切换由 Flutter 端「标准/卫星」按钮控制（set_layer 消息），
    // 不再添加原生 MapTypeControl，避免与 Flutter 控件重复。
  }catch(e){/* 控件添加失败不阻塞地图渲染，静默忽略 */}

  // 容器尺寸变化时重取景
  if(typeof ResizeObserver!=='undefined'){
    var obs=new ResizeObserver(function(){if(_map){fitCampus()}});
    obs.observe(document.getElementById('map'))
  }

  // 延迟一帧再开始取景（容器高 0 问题）
  var tries=0;
  function tryFit(){
    tries++;
    var sz=_map.getSize();
    var h=(sz && sz.height)||0;
    if(h>200){fitCampus();}
    else if(tries<10){setTimeout(tryFit,150);}
    else{fitCampus();}
  }
  tryFit();

  // 瓦片加载检测
  startTileWatchdog();

  // 渲染标注
  renderSteps();
  if(mode==='edit'){
    var h=document.getElementById('editHint');
    if(h){h.classList.add('show');setTimeout(function(){h.classList.remove('show')},3500)}
  }
  notify('ready',{});
}

/* ════ 渲染步骤标注 + 路线（GL版）═══ */
function renderSteps(){
  setupPulseOv(); // 兜底：确保原型已定义（refresh 消息可能先于 init 完成前到达）
  _ovs.forEach(function(o){try{_map.removeOverlay(o)}catch(e){}});_ovs=[];
  if(_poly){try{_map.removeOverlay(_poly)}catch(e){}_poly=null}
  var pts=[];
  _steps.forEach(function(s,i){
    var bd=wgs2bd(s.lng,s.lat);
    var pt=new BMapGL.Point(bd[0],bd[1]);
    pts.push(pt);
    try{
      var ov=new PulseOverlay(pt,s,i);
      _map.addOverlay(ov);_ovs.push(ov);
    }catch(e){/* 单个标注失败静默忽略 */}
  });
  if(pts.length>1){
    try{
      _poly=new BMapGL.Polyline(pts,{
        strokeColor:'#1677FF',strokeWeight:3,
        strokeOpacity:.6,strokeStyle:'dashed'
      });
      _map.addOverlay(_poly);
    }catch(e){/* 路线失败静默忽略 */}
  }
  updateStatus();
}

function updateStatus(){
  _ovs.forEach(function(o,i){try{o.setStatus(i<_cur?'done':i===_cur?'active':'pending')}catch(e){}});
}

/* ════ 切换当前步骤 ════ */
function setStep(idx){
  _cur=idx||0;updateStatus();
  if(_ovs[idx] && _ovs[idx]._pt){
    try{_map.panTo(_ovs[idx]._pt)}catch(e){}
  }
}

/* ════ 2D / 3D 视角切换（BMapGL 原生 3D 实景导航）════
 * 2D：俯视平面（tilt=0，关闭建筑）
 * 3D：倾斜透视 + 楼块（tilt=65，heading=-25，开启建筑）→ 实景导航效果
 * ════ */
var _is3D=false;
function set3DMode(enabled){
  _is3D=!!enabled;
  if(!_map||typeof BMapGL==='undefined')return;
  try{
    if(_is3D){
      _map.setDisplayOptions({building:true,poi:true,road:true});
      _map.setTilt(65);           // 更大倾斜角，增强实景透视感
      _map.setHeading(-25);       // 旋转视角，立体感更强
    } else {
      _map.setTilt(0);
      _map.setHeading(0);
      _map.setDisplayOptions({building:false,poi:true,road:true});
    }
  }catch(e){
    try{
      if(_is3D){_map.setTilt(65);_map.setDisplayOptions({building:true})}else{_map.setTilt(0);_map.setDisplayOptions({building:false})}
    }catch(e2){/* 3D 切换失败静默忽略 */}
  }
}

/* ════ 图层切换：标准 / 卫星 ════
 * standard：BMAP_NORMAL_MAP（矢量标准图）
 * satellite：BMAP_SATELLITE_MAP（卫星影像图）
 * 3D 实景模式下两者均可叠加建筑透视，由 set3DMode 控制。
 * ════ */
var _layer='standard';
function setMapLayer(layer){
  _layer=(layer==='satellite')?'satellite':'standard';
  if(!_map||typeof BMapGL==='undefined')return;
  try{
    if(_layer==='satellite'){
      _map.setMapTypeV2(BMAP_SATELLITE_MAP);
    } else {
      _map.setMapTypeV2(BMAP_NORMAL_MAP);
    }
  }catch(e){
    try{
      // 旧版 API 兜底
      _map.setMapType(_layer==='satellite'?BMAP_SATELLITE_MAP:BMAP_NORMAL_MAP);
    }catch(e2){/* 图层切换失败静默忽略 */}
  }
}

/* ════ 与 Flutter 通信 ════ */
function notify(type,data){
  var msg=Object.assign({type:type},data||{});
  if(typeof FlutterBridge!=='undefined'){
    try{FlutterBridge.postMessage(JSON.stringify(msg))}catch(e){}
  }
  try{(window.parent||window.top||window).postMessage(msg,'*')}catch(e){}
}

/* ════ 消息路由 ════
 * 注意：地图在 window.load 时自动初始化（内嵌 AK），不依赖 init 消息传 AK。
 * init 消息仅用于更新 steps/campus/mode 等业务数据。
 * 这解决了 Flutter iframe 中 postMessage 时序不稳定导致地图不渲染的问题。
 */
var _pendingInit=null; // init 在地图就绪前到达时暂存

window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='init'){
    if(_map){
      // 地图已初始化，更新业务数据并重新取景确保范围=校园范围
      _steps=d.steps||_steps;
      _cur=d.currentStep!=null?d.currentStep:_cur;
      _mode=d.mode||_mode;
      if(d.campusId&&d.campusId!==_campusId){
        fitCampusById(d.campusId);
      }else{
        fitCampus(); // 同校区也重新取景，确保地图范围与校园范围一致
      }
      renderSteps();
    }else{
      // 地图尚未就绪，暂存数据，自动初始化完成后会使用
      _pendingInit=d;
    }
  } else if(d.type==='set_step'){
    setStep(d.index||0);
  } else if(d.type==='refresh'){
    _steps=d.steps||_steps;
    _cur=d.currentStep!=null?d.currentStep:_cur;
    // 更新编辑模式（Flutter 切换 editMode 时带上 mode 字段）
    var prevMode=_mode;
    _mode=d.mode||_mode;
    if(_mode!==prevMode){
      // 模式切换：显示/隐藏编辑提示
      var h=document.getElementById('editHint');
      if(_mode==='edit'){
        if(h){h.classList.add('show');setTimeout(function(){h.classList.remove('show')},3500)}
      }else{
        if(h){h.classList.remove('show')}
      }
    }
    renderSteps();
  } else if(d.type==='fit_campus'){
    fitCampusById(d.campusId||d.id);
  } else if(d.type==='set_3d'){
    set3DMode(d.enabled===true);
  } else if(d.type==='set_layer'){
    setMapLayer(d.layer||'standard');
  }
});

/* ════ URL 参数读取 ════ */
function _getUrlParam(name){
  try{
    var u=new URL(window.location.href);
    return u.searchParams.get(name)||'';
  }catch(e){return ''}
}

/* ════ 自动初始化（window.load 后立即执行）════
 * 诊断发现 Flutter iframe 的 postMessage 时序不稳定：
 *   ready → init 的往返可能因 widget 重建/尺寸同步等问题丢失，
 *   导致 BMapGL 脚本已加载但 initMap 从未被调用。
 * 改为 window.load 后直接用内嵌 AK 加载 BMapGL 并初始化地图，
 * init 消息降级为"数据更新"（见上方的 _pendingInit 逻辑）。
 */
var _DEFAULT_BAIDU_AK='OUouSU6WbYExGTlnDEFqqruhTH60KAwO';

window.addEventListener('load',function(){
  var ak=_getUrlParam('ak')||_DEFAULT_BAIDU_AK;
  var campus=_getUrlParam('campus')||'huifeng';
  loadBaiduGL(ak).then(function(){
    var data=_pendingInit||{};
    // 优先用 URL 的 campus 参数（Flutter 创建 iframe 时传入），
    // 其次用 init 消息暂存的 campusId，最后默认 huifeng
    var cid=data.campusId||campus||'huifeng';
    initMap(data.steps||[],data.currentStep||0,data.mode||'view',cid);
    // 地图完全就绪后通知 Flutter（Flutter 收到后会发送 init 更新业务数据）
    setTimeout(function(){notify('ready',{})},200);
  }).catch(function(err){
    showTileAlert();
  });
});
</script>
