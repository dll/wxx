  <!-- 全局 JS 错误抑制：Flutter Web 异步未处理错误仅记录，不弹控制台 Uncaught Error -->
  <script>
    self.addEventListener('error', function(e) {
      if (e.message === 'Error' || e.message?.startsWith('Error')) {
        e.preventDefault();
      }
    });
    self.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 清除旧 Service Worker 与缓存 → 再动态加载 Flutter 入口
    // 避免旧 SW 拦截新资源导致 "Failed to fetch" 错误
    (function() {
      var scriptLoaded = false;

      function loadFlutter() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        // 永久禁用 Service Worker 注册：flutter_bootstrap.js 默认会注册
        // flutter_service_worker.js 缓存所有资源，导致新版本不生效。
        // 重写 register 为 no-op，确保每次都从服务器加载最新资源。
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register = function() {
            return Promise.reject(new Error('SW disabled by app config'));
          };
        }
        var el = document.createElement('script');
        el.src = 'flutter_bootstrap.js';
        document.body.appendChild(el);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          var hadOld = regs.length > 0;
          var jobs = regs.map(function(reg) { return reg.unregister(); });
          if ('caches' in self) {
            jobs.push(caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }));
          }
          return Promise.all(jobs).then(function() {
            if (hadOld && !sessionStorage.getItem('wxx-cache-refreshed')) {
              sessionStorage.setItem('wxx-cache-refreshed', '1');
              location.reload();
            } else {
              loadFlutter();
            }
          });
        }, loadFlutter);
        return;
      }
      loadFlutter();
    })();
  </script>
