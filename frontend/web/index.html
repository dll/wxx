<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="蔚小芯 — 滁州学院计算机学院智慧学工 AI 助手">

  <!-- 全局 JS 错误抑制：Flutter Web 异步未处理错误仅记录，不弹控制台 Uncaught Error -->
  <script>
    self.addEventListener('error', function(e) {
      if (e.message === 'Error' || e.message?.startsWith('Error')) {
        e.preventDefault();
      }
    });
    self.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="蔚小芯">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>蔚小芯</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 清除旧 Service Worker 与缓存，避免继续加载历史登录页。
    if ('serviceWorker' in navigator) {
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(reg) { return reg.unregister(); }));
        }),
        'caches' in self
          ? caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(key) { return caches.delete(key); }));
            })
          : Promise.resolve()
      ]).then(function() {
        if (navigator.serviceWorker.controller &&
            !sessionStorage.getItem('wxx-cache-refreshed')) {
          sessionStorage.setItem('wxx-cache-refreshed', '1');
          location.reload();
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
