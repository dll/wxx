<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="蔚小芯 — 滁州学院计算机学院智慧学工 AI 助手">

  <!-- 全局 JS 错误抑制：Flutter Web 异步未处理错误仅记录，不弹控制台 Uncaught Error -->
  <script>
    self.addEventListener('error', function(e) {
      if (e.message === 'Error' || e.message?.startsWith('Error')) {
        e.preventDefault();
      }
    });
    self.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="蔚小芯">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>蔚小芯</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 清除旧 Service Worker 与缓存 → 再动态加载 Flutter 入口
    // 避免旧 SW 拦截新资源导致 "Failed to fetch" 错误
    (function() {
      var scriptLoaded = false;

      function loadFlutter() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var el = document.createElement('script');
        el.src = 'flutter_bootstrap.js';
        document.body.appendChild(el);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          var hadOld = regs.length > 0;
          var jobs = regs.map(function(reg) { return reg.unregister(); });
          if ('caches' in self) {
            jobs.push(caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }));
          }
          return Promise.all(jobs).then(function() {
            if (hadOld && !sessionStorage.getItem('wxx-cache-refreshed')) {
              sessionStorage.setItem('wxx-cache-refreshed', '1');
              location.reload();
            } else {
              loadFlutter();
            }
          });
        }, loadFlutter);
        return;
      }
      loadFlutter();
    })();
  </script>
</body>
</html>
